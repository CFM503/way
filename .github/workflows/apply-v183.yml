name: Apply v1.8.3 performance patch
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch, test and build
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('goway/goway.go'); s=p.read_text()
          def once(a,b):
              global s
              if s.count(a)!=1: raise SystemExit(f'expected one: {a!r}, got {s.count(a)}')
              s=s.replace(a,b,1)
          once('Version        = "1.8.2"','Version        = "1.8.3"')
          once('wFlag := flag.Int("W", 512, "App Buffer Size in KB (default 64KB, recommend 512-4096 for high-throughput streaming)")','wFlag := flag.Int("W", 128, "App Buffer Size in KB (default 128KB, recommend 256-1024 for high-throughput streaming)")')
          once('muxClientStreamBufferLimit = 16 * 1024 * 1024','muxClientStreamBufferLimit = 8 * 1024 * 1024')
          once('muxServerStreamBufferLimit = 16 * 1024 * 1024','muxServerStreamBufferLimit = 8 * 1024 * 1024')
          once('muxStreamIngressQueue      = 512','muxStreamIngressQueue      = 16')
          once('const maxChunk = 60 * 1024','const maxChunk = 65528')
          once('readChan: make(chan muxDataFrame, 128)','readChan: make(chan muxDataFrame, 64)')
          once('writeChan: make(chan muxDataFrame, 256)','writeChan: make(chan muxDataFrame, 64)')
          pat=r'func \(s \*MuxStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxStream\) PushData\(data \[\]byte\) bool'
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('client PushDataFrame not found')
          new='''func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))\n\tfor {\n\t\ts.bufMu.Lock()\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\ts.bufMu.Unlock()\n\t\t\treturn false\n\t\tdefault:\n\t\t}\n\t\tif frame.data == nil { s.readClosed.Store(true) }\n\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {\n\t\t\tselect {\n\t\t\tcase s.readChan <- frame:\n\t\t\t\ts.queuedBytes += dataLen\n\t\t\t\ts.bufMu.Unlock()\n\t\t\t\treturn true\n\t\t\tdefault:\n\t\t\t}\n\t\t}\n\t\ts.bufMu.Unlock()\n\t\tdeadline := time.NewTimer(muxPushStallTimeout)\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\tif !deadline.Stop() { <-deadline.C }\n\t\t\treturn false\n\t\tcase <-s.hasSpace:\n\t\t\tif !deadline.Stop() { <-deadline.C }\n\t\t\tcontinue\n\t\tcase <-deadline.C:\n\t\t\tlogWarn("[MUX] Stream %d receive backpressure timeout, resetting stream", s.id)\n\t\t\ts.Reset()\n\t\t\treturn false\n\t\t}\n\t}\n}\n\nfunc (s *MuxStream) PushData(data []byte) bool'''
          s=s[:m.start()]+new+s[m.end():]
          pat=r'func \(s \*MuxServerStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxServerStream\) PushData\(data \[\]byte\) bool'
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('server PushDataFrame not found')
          new='''func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))\n\tfor {\n\t\ts.bufMu.Lock()\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\ts.bufMu.Unlock()\n\t\t\treturn false\n\t\tdefault:\n\t\t}\n\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {\n\t\t\tselect {\n\t\t\tcase s.writeChan <- frame:\n\t\t\t\ts.queuedBytes += dataLen\n\t\t\t\ts.bufMu.Unlock()\n\t\t\t\treturn true\n\t\t\tdefault:\n\t\t\t}\n\t\t}\n\t\ts.bufMu.Unlock()\n\t\tdeadline := time.NewTimer(muxPushStallTimeout)\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\tif !deadline.Stop() { <-deadline.C }\n\t\t\treturn false\n\t\tcase <-s.hasSpace:\n\t\t\tif !deadline.Stop() { <-deadline.C }\n\t\t\tcontinue\n\t\tcase <-deadline.C:\n\t\t\tlogWarn("[SERVER-MUX] Stream %d receive backpressure timeout, resetting stream", s.id)\n\t\t\ts.Close()\n\t\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)\n\t\t\treturn false\n\t\t}\n\t}\n}\n\nfunc (s *MuxServerStream) PushData(data []byte) bool'''
          s=s[:m.start()]+new+s[m.end():]
          p.write_text(s)
          PY
          gofmt -w goway/goway.go
          go test ./...
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/goway-windows-amd64.exe ./goway
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/goway-linux-amd64 ./goway
          rm -f .github/workflows/apply-v183.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go .github/workflows/apply-v183.yml
          git commit -m 'Release v1.8.3: reduce MUX timer and buffer overhead'
          git push origin "HEAD:${BRANCH}"
