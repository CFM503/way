name: Finalize GoWay v1.8.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch source and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_range(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          src = Path('goway/goway.go')
          s = src.read_text(encoding='utf-8')

          # Application relay buffer: 12 MiB absolute cap = 4096 KiB x 3.
          s = s.replace('if bufSize > 256*1024+14+MuxHeaderLen {', 'if bufSize > 12*1024*1024+14+MuxHeaderLen {', 1)
          s = s.replace('bufSize = 256*1024+14+MuxHeaderLen', 'bufSize = 12*1024*1024+14+MuxHeaderLen', 1)
          s = s.replace('*wFlag > 16384', '*wFlag > 12288', 1)
          s = s.replace('must be between 1 and 16384', 'must be between 1 and 12288', 1)

          if 'muxStreamIngressQueue' not in s:
              s = s.replace(
                  'muxServerStreamBufferLimit = 8 * 1024 * 1024',
                  'muxServerStreamBufferLimit = 16 * 1024 * 1024\n\tmuxStreamIngressQueue    = 16\n\tmuxPushStallTimeout       = 3 * time.Second',
                  1,
              )

          # Client stream structure.
          client_struct_start = s.index('type MuxStream struct')
          client_struct_end = s.index('\n}', client_struct_start)
          client_struct = s[client_struct_start:client_struct_end]
          if 'ingress     chan muxDataFrame' not in client_struct:
              client_struct = client_struct.replace('\treadMu      sync.Mutex', '\treadMu      sync.Mutex\n\tingress     chan muxDataFrame')
              s = s[:client_struct_start] + client_struct + s[client_struct_end:]

          client_block = """func newMuxStream(id uint32, session MuxSessionInterface) *MuxStream {
    st := &MuxStream{
        id:       id,
        session:  session,
        readChan: make(chan muxDataFrame, 128),
        closed:   make(chan struct{}),
        hasSpace: make(chan struct{}, 1),
        ingress:  make(chan muxDataFrame, muxStreamIngressQueue),
    }
    go st.deliveryLoop()
    return st
}

func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
    select {
    case <-s.closed:
        frame.release()
        return false
    case s.ingress <- frame:
        return true
    default:
        logWarn("[MUX] Stream %d ingress queue full, resetting stream", s.id)
        frame.release()
        s.Reset()
        return false
    }
}

func (s *MuxStream) deliveryLoop() {
    for {
        select {
        case <-s.closed:
            return
        case frame := <-s.ingress:
            if !s.PushDataFrame(frame) {
                frame.release()
            }
        }
    }
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
    dataLen := int64(len(frame.data))
    deadline := time.NewTimer(muxPushStallTimeout)
    defer deadline.Stop()

    for {
        s.bufMu.Lock()
        select {
        case <-s.closed:
            s.bufMu.Unlock()
            return false
        default:
        }
        if frame.data == nil {
            s.readClosed.Store(true)
        }
        if s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
            select {
            case s.readChan <- frame:
                s.queuedBytes += dataLen
                s.bufMu.Unlock()
                return true
            default:
            }
        }
        s.bufMu.Unlock()
        select {
        case <-s.closed:
            return false
        case <-s.hasSpace:
            continue
        case <-deadline.C:
            logWarn("[MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
            s.Reset()
            return false
        }
    }
}

func (s *MuxStream) PushData(data []byte) bool {
    return s.PushDataFrame(muxDataFrame{data: data})
}

"""
          s = replace_range(s, 'func newMuxStream(', 'func (s *MuxStream) PushEOF()', client_block)

          # Client readLoop routes frames to ingress so one slow stream cannot stall the session.
          s = s.replace('if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t}', 'st.enqueueDataFrame(frame)', 1)
          s = s.replace('case MuxCmdFIN:\n\t\t\tst.PushEOF()', 'case MuxCmdFIN:\n\t\t\tst.enqueueDataFrame(muxDataFrame{data: nil})', 1)

          cleanup_start = s.index('func (s *MuxStream) cleanup()')
          cleanup_end = s.index('func (s *MuxStream) Close()', cleanup_start)
          cleanup_block = """func (s *MuxStream) cleanup() {
    s.readMu.Lock()
    s.curFrame.release()
    s.readBuf = nil
    s.readPos = 0
    s.readMu.Unlock()

    s.bufMu.Lock()
    s.queuedBytes = 0
    s.bufMu.Unlock()

    for {
        select {
        case f := <-s.readChan:
            f.release()
        case f := <-s.ingress:
            f.release()
        default:
            return
        }
    }
}

"""
          s = s[:cleanup_start] + cleanup_block + s[cleanup_end:]

          # Server stream structure.
          server_struct_start = s.index('type MuxServerStream struct')
          server_struct_end = s.index('func newMuxServerStream(', server_struct_start)
          server_struct = s[server_struct_start:server_struct_end]
          if 'ingress     chan muxDataFrame' not in server_struct:
              server_struct = server_struct.replace('\thasSpace    chan struct{}', '\thasSpace    chan struct{}\n\tingress     chan muxDataFrame')
              s = s[:server_struct_start] + server_struct + s[server_struct_end:]

          server_block = """func newMuxServerStream(id uint32, session *MuxServerSession) *MuxServerStream {
    st := &MuxServerStream{
        id:        id,
        session:   session,
        writeChan: make(chan muxDataFrame, 256),
        closed:    make(chan struct{}),
        hasSpace:  make(chan struct{}, 1),
        ingress:   make(chan muxDataFrame, muxStreamIngressQueue),
    }
    go st.deliveryLoop()
    return st
}

func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
    select {
    case <-s.closed:
        frame.release()
        return false
    case s.ingress <- frame:
        return true
    default:
        logWarn("[SERVER-MUX] Stream %d ingress queue full, resetting stream", s.id)
        frame.release()
        s.Close()
        _ = s.session.SendFrame(s.id, MuxCmdRST, nil)
        return false
    }
}

func (s *MuxServerStream) deliveryLoop() {
    for {
        select {
        case <-s.closed:
            return
        case frame := <-s.ingress:
            if !s.PushDataFrame(frame) {
                frame.release()
            }
        }
    }
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
    dataLen := int64(len(frame.data))
    deadline := time.NewTimer(muxPushStallTimeout)
    defer deadline.Stop()

    for {
        s.bufMu.Lock()
        select {
        case <-s.closed:
            s.bufMu.Unlock()
            return false
        default:
        }
        if s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
            select {
            case s.writeChan <- frame:
                s.queuedBytes += dataLen
                s.bufMu.Unlock()
                return true
            default:
            }
        }
        s.bufMu.Unlock()
        select {
        case <-s.closed:
            return false
        case <-s.hasSpace:
            continue
        case <-deadline.C:
            logWarn("[SERVER-MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
            s.Close()
            _ = s.session.SendFrame(s.id, MuxCmdRST, nil)
            return false
        }
    }
}

func (s *MuxServerStream) PushData(data []byte) bool {
    return s.PushDataFrame(muxDataFrame{data: data})
}

"""
          s = replace_range(s, 'func newMuxServerStream(', 'func (s *MuxServerStream) consumedBytes', server_block)

          s = s.replace('if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tsession.streamsMu.Lock()\n\t\t\t\t\tdelete(session.streams, streamID)\n\t\t\t\t\tsession.streamsMu.Unlock()\n\t\t\t\t}', 'st.enqueueDataFrame(frame)', 1)
          s = s.replace('if !st.PushDataFrame(muxDataFrame{data: nil}) {\n\t\t\t\tsession.streamsMu.Lock()\n\t\t\t\tdelete(session.streams, streamID)\n\t\t\t\tsession.streamsMu.Unlock()\n\t\t\t}', 'st.enqueueDataFrame(muxDataFrame{data: nil})', 1)

          close_start = s.index('func (s *MuxServerStream) Close()')
          close_end = s.index('func (s *MuxServerSession) Close()', close_start)
          close_block = """func (s *MuxServerStream) Close() {
    s.closeOnce.Do(func() {
        close(s.closed)
        if s.targetConn != nil {
            s.targetConn.Close()
        }
        s.bufMu.Lock()
        s.queuedBytes = 0
        s.bufMu.Unlock()
        for {
            select {
            case frame := <-s.writeChan:
                frame.release()
            case frame := <-s.ingress:
                frame.release()
            default:
                return
            }
        }
    })
}

"""
          s = s[:close_start] + close_block + s[close_end:]
          src.write_text(s, encoding='utf-8')

          # Fix Linux/macOS subprocess tests: build a temporary binary for the current runner OS.
          test = Path('goway/goway_test.go')
          ts = test.read_text(encoding='utf-8')
          if '\t"path/filepath"\n' not in ts:
              ts = ts.replace('\t"os/exec"\n', '\t"os/exec"\n\t"path/filepath"\n', 1)
          if '\t"runtime"\n' not in ts:
              ts = ts.replace('\t"path/filepath"\n', '\t"path/filepath"\n\t"runtime"\n', 1)

          helper = """func buildTestBinary(t *testing.T) string {
    t.Helper()
    name := "goway-test"
    if runtime.GOOS == "windows" {
        name += ".exe"
    }
    path := filepath.Join(t.TempDir(), name)
    cmd := exec.Command("go", "build", "-o", path, ".")
    out, err := cmd.CombinedOutput()
    if err != nil {
        t.Fatalf("Failed to build goway test binary: %v\\n%s", err, out)
    }
    return path
}

"""
          if 'func buildTestBinary(' not in ts:
              ts = ts.replace('func TestEndToEndSubprocessIntegration(t *testing.T) {', helper + 'func TestEndToEndSubprocessIntegration(t *testing.T) {', 1)
          if 'binaryPath := buildTestBinary(t)' not in ts:
              ts = ts.replace('\t// 2. Start GOWAY Server subprocess\n', '\tbinaryPath := buildTestBinary(t)\n\t// 2. Start GOWAY Server subprocess\n', 1)
          ts = ts.replace('serverCmd := exec.Command(".\\goway.exe",', 'serverCmd := exec.Command(binaryPath,', 1)
          ts = ts.replace('clientCmd := exec.Command(".\\goway.exe",', 'clientCmd := exec.Command(binaryPath,', 1)
          test.write_text(ts, encoding='utf-8')

      - name: Format and verify
        run: |
          set -e
          gofmt -w goway/goway.go goway/goway_test.go
          cd goway
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Commit source and cleanup temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goway/goway.go goway/goway_test.go
          git rm -f .github/workflows/apply-goway-finalize.yml .github/workflows/apply-goway-v182-fix*.yml 2>/dev/null || true
          git add -A
          git diff --cached --quiet || git commit -m "fix: finalize goway v1.8.2 mux backpressure [skip ci]"
          git push
