name: Finalize GoWay v1.8.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final refactor
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path('goway/goway.go')
          s = src.read_text(encoding='utf-8')

          # Mux limits/queues.
          if 'muxStreamIngressQueue' not in s:
              s = s.replace('muxServerStreamBufferLimit = 8 * 1024 * 1024', 'muxServerStreamBufferLimit = 16 * 1024 * 1024\n\tmuxStreamIngressQueue    = 16\n\tmuxPushStallTimeout       = 3 * time.Second', 1)

          # Add ingress to both stream structs once.
          pos = s.find('type MuxStream struct')
          end = s.find('\n}', pos)
          chunk = s[pos:end]
          if 'ingress chan muxDataFrame' not in chunk:
              chunk = chunk.replace('\treadMu      sync.Mutex', '\treadMu      sync.Mutex\n\tingress     chan muxDataFrame')
              s = s[:pos] + chunk + s[end:]
          pos = s.find('type MuxServerStream struct')
          end = s.find('\n}', pos)
          chunk = s[pos:end]
          if 'ingress chan muxDataFrame' not in chunk:
              chunk = chunk.replace('\thasSpace    chan struct{}', '\thasSpace    chan struct{}\n\tingress     chan muxDataFrame')
              s = s[:pos] + chunk + s[end:]

          # Replace MuxStream constructor through PushEOF with isolated ingress worker.
          a = s.index('func newMuxStream(')
          b = s.index('func (s *MuxStream) PushEOF()', a)
          client_impl = '''func newMuxStream(id uint32, session MuxSessionInterface) *MuxStream {\n\tst := &MuxStream{\n\t\tid:       id,\n\t\tsession:  session,\n\t\treadChan: make(chan muxDataFrame, 128),\n\t\tclosed:   make(chan struct{}),\n\t\thasSpace: make(chan struct{}, 1),\n\t\tingress:  make(chan muxDataFrame, muxStreamIngressQueue),\n\t}\n\tgo st.deliveryLoop()\n\treturn st\n}\n\nfunc (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {\n\tselect {\n\tcase <-s.closed:\n\t\tframe.release()\n\t\treturn false\n\tcase s.ingress <- frame:\n\t\treturn true\n\tdefault:\n\t\tlogWarn("[MUX] Stream %d ingress queue full, resetting stream", s.id)\n\t\tframe.release()\n\t\ts.Reset()\n\t\treturn false\n\t}\n}\n\nfunc (s *MuxStream) deliveryLoop() {\n\tfor {\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\treturn\n\t\tcase frame := <-s.ingress:\n\t\t\tif !s.PushDataFrame(frame) {\n\t\t\t\tframe.release()\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))\n\tdeadline := time.NewTimer(muxPushStallTimeout)\n\tdefer deadline.Stop()\n\n\tfor {\n\t\ts.bufMu.Lock()\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\ts.bufMu.Unlock()\n\t\t\treturn false\n\t\tdefault:\n\t\t}\n\t\tif frame.data == nil {\n\t\t\ts.readClosed.Store(true)\n\t\t}\n\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {\n\t\t\tselect {\n\t\t\tcase s.readChan <- frame:\n\t\t\t\ts.queuedBytes += dataLen\n\t\t\t\ts.bufMu.Unlock()\n\t\t\t\treturn true\n\t\t\tdefault:\n\t\t\t}\n\t\t}\n\t\ts.bufMu.Unlock()\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\treturn false\n\t\tcase <-s.hasSpace:\n\t\t\tcontinue\n\t\tcase <-deadline.C:\n\t\t\tlogWarn("[MUX] Stream %d receive backpressure timeout, resetting stream", s.id)\n\t\t\ts.Reset()\n\t\t\treturn false\n\t\t}\n\t}\n}\n\n'''
          s = s[:a] + client_impl + s[b:]

          # Client dispatcher: non-blocking ingress.
          s = re.sub(r'if !st\.PushDataFrame\(frame\) \{\s*frame\.release\(\)\s*\}', 'st.enqueueDataFrame(frame)', s, count=1)
          s = s.replace('case MuxCmdFIN:\n\t\t\tst.PushEOF()', 'case MuxCmdFIN:\n\t\t\tst.enqueueDataFrame(muxDataFrame{data: nil})', 1)

          # Replace server constructor + PushDataFrame through consumedBytes.
          a = s.index('func newMuxServerStream(')
          b = s.index('func (s *MuxServerStream) consumedBytes', a)
          server_impl = '''func newMuxServerStream(id uint32, session *MuxServerSession) *MuxServerStream {\n\tst := &MuxServerStream{\n\t\tid:        id,\n\t\tsession:   session,\n\t\twriteChan: make(chan muxDataFrame, 256),\n\t\tclosed:    make(chan struct{}),\n\t\thasSpace:  make(chan struct{}, 1),\n\t\tingress:   make(chan muxDataFrame, muxStreamIngressQueue),\n\t}\n\tgo st.deliveryLoop()\n\treturn st\n}\n\nfunc (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {\n\tselect {\n\tcase <-s.closed:\n\t\tframe.release()\n\t\treturn false\n\tcase s.ingress <- frame:\n\t\treturn true\n\tdefault:\n\t\tlogWarn("[SERVER-MUX] Stream %d ingress queue full, resetting stream", s.id)\n\t\tframe.release()\n\t\ts.Close()\n\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)\n\t\treturn false\n\t}\n}\n\nfunc (s *MuxServerStream) deliveryLoop() {\n\tfor {\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\treturn\n\t\tcase frame := <-s.ingress:\n\t\t\tif !s.PushDataFrame(frame) {\n\t\t\t\tframe.release()\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))\n\tdeadline := time.NewTimer(muxPushStallTimeout)\n\tdefer deadline.Stop()\n\n\tfor {\n\t\ts.bufMu.Lock()\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\ts.bufMu.Unlock()\n\t\t\treturn false\n\t\tdefault:\n\t\t}\n\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {\n\t\t\tselect {\n\t\t\tcase s.writeChan <- frame:\n\t\t\t\ts.queuedBytes += dataLen\n\t\t\t\ts.bufMu.Unlock()\n\t\t\t\treturn true\n\t\t\tdefault:\n\t\t\t}\n\t\t}\n\t\ts.bufMu.Unlock()\n\t\tselect {\n\t\tcase <-s.closed:\n\t\t\treturn false\n\t\tcase <-s.hasSpace:\n\t\t\tcontinue\n\t\tcase <-deadline.C:\n\t\t\tlogWarn("[SERVER-MUX] Stream %d receive backpressure timeout, resetting stream", s.id)\n\t\t\ts.Close()\n\t\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)\n\t\t\treturn false\n\t\t}\n\t}\n}\n\n'''
          s = s[:a] + server_impl + s[b:]

          s = re.sub(r'if !st\.PushDataFrame\(frame\) \{\s*frame\.release\(\)\s*session\.streamsMu\.Lock\(\)\s*delete\(session\.streams, streamID\)\s*session\.streamsMu\.Unlock\(\)\s*\}', 'st.enqueueDataFrame(frame)', s, count=1)
          s = re.sub(r'if !st\.PushDataFrame\(muxDataFrame\{data: nil\}\) \{\s*session\.streamsMu\.Lock\(\)\s*delete\(session\.streams, streamID\)\s*session\.streamsMu\.Unlock\(\)\s*\}', 'st.enqueueDataFrame(muxDataFrame{data: nil})', s, count=1)

          # Raise pooled relay buffer cap 256 KiB -> 512 KiB, accepting the existing -W CLI value.
          s = re.sub(r'if bufSize > 256\*1024\+14\+MuxHeaderLen \{\s*bufSize = 256\*1024\+14\+MuxHeaderLen\s*\}', 'if bufSize > 512*1024+14+MuxHeaderLen {\n\t\tbufSize = 512*1024+14+MuxHeaderLen\n\t}', s, count=1)

          # Drain ingress on client stream cleanup.
          a = s.index('func (s *MuxStream) cleanup()')
          b = s.index('func (s *MuxStream) Close()', a)
          cleanup_client = '''func (s *MuxStream) cleanup() {\n\tfor {\n\t\tselect {\n\t\tcase f := <-s.readChan:\n\t\t\tf.release()\n\t\tdefault:\n\t\t\tfor {\n\t\t\t\tselect {\n\t\t\t\tcase f := <-s.ingress:\n\t\t\t\t\tf.release()\n\t\t\t\tdefault:\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n}\n\n'''
          s = s[:a] + cleanup_client + s[b:]

          # Server Close drains both queues.
          a = s.index('func (s *MuxServerStream) Close()')
          b = s.index('func (s *MuxServerSession) Close()', a)
          close_server = '''func (s *MuxServerStream) Close() {\n\ts.closeOnce.Do(func() {\n\t\tclose(s.closed)\n\t\tif s.targetConn != nil {\n\t\t\ts.targetConn.Close()\n\t\t}\n\t\ts.bufMu.Lock()\n\t\ts.queuedBytes = 0\n\t\ts.bufMu.Unlock()\n\t\tfor {\n\t\t\tselect {\n\t\t\tcase frame := <-s.writeChan:\n\t\t\t\tframe.release()\n\t\t\tcase frame := <-s.ingress:\n\t\t\t\tframe.release()\n\t\t\tdefault:\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t})\n}\n\n'''
          s = s[:a] + close_server + s[b:]

          src.write_text(s, encoding='utf-8')

          # Cross-platform subprocess test binary.
          test = Path('goway/goway_test.go')
          ts = test.read_text(encoding='utf-8')
          if '\t"path/filepath"\n' not in ts:
              ts = ts.replace('\t"os/exec"\n', '\t"os/exec"\n\t"path/filepath"\n', 1)
          helper = '''func buildTestBinary(t *testing.T) string {\n\tt.Helper()\n\tname := "goway-test"\n\tif runtime.GOOS == "windows" {\n\t\tname += ".exe"\n\t}\n\tpath := filepath.Join(t.TempDir(), name)\n\tcmd := exec.Command("go", "build", "-o", path, ".")\n\tout, err := cmd.CombinedOutput()\n\tif err != nil {\n\t\tt.Fatalf("Failed to build goway test binary: %v\\n%s", err, out)\n\t}\n\treturn path\n}\n\n'''
          if helper not in ts:
              ts = ts.replace('func TestEndToEndSubprocessIntegration(t *testing.T) {', helper + 'func TestEndToEndSubprocessIntegration(t *testing.T) {', 1)
          ts = ts.replace('serverCmd := exec.Command(".\\\\goway.exe",', 'serverCmd := exec.Command(binaryPath,', 1)
          ts = ts.replace('\tserverPort := 18880\n\tserverCmd := exec.Command(binaryPath,', '\tbinaryPath := buildTestBinary(t)\n\tserverPort := 18880\n\tserverCmd := exec.Command(binaryPath,', 1)
          ts = ts.replace('clientCmd := exec.Command(".\\\\goway.exe",', 'clientCmd := exec.Command(binaryPath,', 1)
          test.write_text(ts, encoding='utf-8')

      - name: Format and test
        run: |
          gofmt -w goway/goway.go goway/goway_test.go
          cd goway
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Commit and remove all temporary patch workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goway/goway.go goway/goway_test.go
          git rm -f .github/workflows/apply-goway-v182-fix.yml .github/workflows/apply-goway-v182-fix2.yml .github/workflows/apply-goway-v182-fix3.yml .github/workflows/apply-goway-v182-fix4.yml .github/workflows/apply-goway-v182-fix5.yml .github/workflows/apply-goway-finalize.yml || true
          git add -A
          git diff --cached --quiet || git commit -m "fix: finalize goway v1.8.2 mux backpressure [skip ci]"
          git push
