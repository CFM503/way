name: Finalize GoWay v1.8.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch source and tests
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path('goway/goway.go')
          s = src.read_text(encoding='utf-8')

          # Idempotent buffer cap update.
          if 'bufSize > 256*1024+14+MuxHeaderLen' in s:
              s = s.replace('if bufSize > 256*1024+14+MuxHeaderLen {\n\t\tbufSize = 256*1024+14+MuxHeaderLen\n\t}', 'if bufSize > 512*1024+14+MuxHeaderLen {\n\t\tbufSize = 512*1024+14+MuxHeaderLen\n\t}', 1)
          elif 'bufSize > 512*1024+14+MuxHeaderLen' not in s:
              raise SystemExit('buffer cap block is neither 256 KiB nor 512 KiB')

          if 'muxStreamIngressQueue' not in s:
              s = s.replace('\tmuxServerStreamBufferLimit = 8 * 1024 * 1024\n', '\tmuxServerStreamBufferLimit = 16 * 1024 * 1024\n\tmuxStreamIngressQueue    = 16\n\tmuxPushStallTimeout       = 3 * time.Second\n', 1)

          # Client stream ingress.
          pos = s.index('type MuxStream struct')
          end = s.index('\n}', pos)
          chunk = s[pos:end]
          if 'ingress     chan muxDataFrame' not in chunk:
              chunk = chunk.replace('\treadMu      sync.Mutex', '\treadMu      sync.Mutex\n\tingress     chan muxDataFrame')
              s = s[:pos] + chunk + s[end:]

          a = s.index('func newMuxStream(')
          b = s.index('func (s *MuxStream) PushEOF()', a)
          client_impl = '''func newMuxStream(id uint32, session MuxSessionInterface) *MuxStream {
\tst := &MuxStream{
\t\tid:       id,
\t\tsession:  session,
\t\treadChan: make(chan muxDataFrame, 128),
\t\tclosed:   make(chan struct{}),
\t\thasSpace: make(chan struct{}, 1),
\t\tingress:  make(chan muxDataFrame, muxStreamIngressQueue),
\t}
\tgo st.deliveryLoop()
\treturn st
}

func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
\tselect {
\tcase <-s.closed:
\t\tframe.release()
\t\treturn false
\tcase s.ingress <- frame:
\t\treturn true
\tdefault:
\t\tlogWarn("[MUX] Stream %d ingress queue full, resetting stream", s.id)
\t\tframe.release()
\t\ts.Reset()
\t\treturn false
\t}
}

func (s *MuxStream) deliveryLoop() {
\tfor {
\t\tselect {
\t\tcase <-s.closed:
\t\t\treturn
\t\tcase frame := <-s.ingress:
\t\t\tif !s.PushDataFrame(frame) {
\t\t\t\tframe.release()
\t\t\t}
\t\t}
\t}
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.NewTimer(muxPushStallTimeout)
\tdefer deadline.Stop()
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif frame.data == nil {
\t\t\ts.readClosed.Store(true)
\t\t}
\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.readChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\t\tcontinue
\t\tcase <-deadline.C:
\t\t\tlogWarn("[MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
\t\t\ts.Reset()
\t\t\treturn false
\t\t}
\t}
}

func (s *MuxStream) PushData(data []byte) bool {
\treturn s.PushDataFrame(muxDataFrame{data: data})
}

'''
          if 'func (s *MuxStream) enqueueDataFrame' not in s[a:b]:
              s = s[:a] + client_impl + s[b:]
          elif 'func (s *MuxStream) PushData(data []byte)' not in s[a:b]:
              insert = s.index('func (s *MuxStream) PushEOF()', a)
              s = s[:insert] + 'func (s *MuxStream) PushData(data []byte) bool {\n\treturn s.PushDataFrame(muxDataFrame{data: data})\n}\n\n' + s[insert:]

          s = re.sub(r'if !st\.PushDataFrame\(frame\) \{\s*frame\.release\(\)\s*\}', 'st.enqueueDataFrame(frame)', s, count=1)
          s = s.replace('case MuxCmdFIN:\n\t\t\tst.PushEOF()', 'case MuxCmdFIN:\n\t\t\tst.enqueueDataFrame(muxDataFrame{data: nil})', 1)

          # Server stream ingress.
          pos = s.index('type MuxServerStream struct')
          end = s.index('\n}', pos)
          chunk = s[pos:end]
          if 'ingress     chan muxDataFrame' not in chunk:
              chunk = chunk.replace('\thasSpace    chan struct{}', '\thasSpace    chan struct{}\n\tingress     chan muxDataFrame')
              s = s[:pos] + chunk + s[end:]

          a = s.index('func newMuxServerStream(')
          b = s.index('func (s *MuxServerStream) consumedBytes', a)
          server_impl = '''func newMuxServerStream(id uint32, session *MuxServerSession) *MuxServerStream {
\tst := &MuxServerStream{
\t\tid:        id,
\t\tsession:   session,
\t\twriteChan: make(chan muxDataFrame, 256),
\t\tclosed:    make(chan struct{}),
\t\thasSpace:  make(chan struct{}, 1),
\t\tingress:   make(chan muxDataFrame, muxStreamIngressQueue),
\t}
\tgo st.deliveryLoop()
\treturn st
}

func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
\tselect {
\tcase <-s.closed:
\t\tframe.release()
\t\treturn false
\tcase s.ingress <- frame:
\t\treturn true
\tdefault:
\t\tlogWarn("[SERVER-MUX] Stream %d ingress queue full, resetting stream", s.id)
\t\tframe.release()
\t\ts.Close()
\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
\t\treturn false
\t}
}

func (s *MuxServerStream) deliveryLoop() {
\tfor {
\t\tselect {
\t\tcase <-s.closed:
\t\t\treturn
\t\tcase frame := <-s.ingress:
\t\t\tif !s.PushDataFrame(frame) {
\t\t\t\tframe.release()
\t\t\t}
\t\t}
\t}
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.NewTimer(muxPushStallTimeout)
\tdefer deadline.Stop()
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.writeChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\t\tcontinue
\t\tcase <-deadline.C:
\t\t\tlogWarn("[SERVER-MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
\t\t\ts.Close()
\t\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
\t\t\treturn false
\t\t}
\t}
}

func (s *MuxServerStream) PushData(data []byte) bool {
\treturn s.PushDataFrame(muxDataFrame{data: data})
}

'''
          if 'func (s *MuxServerStream) enqueueDataFrame' not in s[a:b]:
              s = s[:a] + server_impl + s[b:]

          s = re.sub(r'if !st\.PushDataFrame\(frame\) \{\s*frame\.release\(\)\s*session\.streamsMu\.Lock\(\)\s*delete\(session\.streams, streamID\)\s*session\.streamsMu\.Unlock\(\)\s*\}', 'st.enqueueDataFrame(frame)', s, count=1)
          s = re.sub(r'if !st\.PushDataFrame\(muxDataFrame\{data: nil\}\) \{\s*session\.streamsMu\.Lock\(\)\s*delete\(session\.streams, streamID\)\s*session\.streamsMu\.Unlock\(\)\s*\}', 'st.enqueueDataFrame(muxDataFrame{data: nil})', s, count=1)

          # Cross-platform integration test.
          test = Path('goway/goway_test.go')
          ts = test.read_text(encoding='utf-8')
          if '\t"path/filepath"\n' not in ts:
              ts = ts.replace('\t"os/exec"\n', '\t"os/exec"\n\t"path/filepath"\n', 1)
          helper = '''func buildTestBinary(t *testing.T) string {
\tt.Helper()
\tname := "goway-test"
\tif runtime.GOOS == "windows" {
\t\tname += ".exe"
\t}
\tpath := filepath.Join(t.TempDir(), name)
\tcmd := exec.Command("go", "build", "-o", path, ".")
\tout, err := cmd.CombinedOutput()
\tif err != nil {
\t\tt.Fatalf("Failed to build goway test binary: %v\\n%s", err, out)
\t}
\treturn path
}

'''
          if 'func buildTestBinary(' not in ts:
              ts = ts.replace('func TestEndToEndSubprocessIntegration(t *testing.T) {', helper + 'func TestEndToEndSubprocessIntegration(t *testing.T) {', 1)
          ts = ts.replace('serverCmd := exec.Command(".\\\\goway.exe",', 'serverCmd := exec.Command(binaryPath,', 1)
          marker = '\t// 2. Start GOWAY Server subprocess\n'
          if 'binaryPath := buildTestBinary(t)' not in ts:
              ts = ts.replace(marker, marker + '\tbinaryPath := buildTestBinary(t)\n', 1)
          ts = ts.replace('clientCmd := exec.Command(".\\\\goway.exe",', 'clientCmd := exec.Command(binaryPath,', 1)
          test.write_text(ts, encoding='utf-8')
          src.write_text(s, encoding='utf-8')

      - name: Format and test
        run: |
          gofmt -w goway/goway.go goway/goway_test.go
          cd goway
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Commit and remove temporary patch workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goway/goway.go goway/goway_test.go
          git rm -f .github/workflows/apply-goway-v182-fix.yml .github/workflows/apply-goway-v182-fix2.yml .github/workflows/apply-goway-v182-fix3.yml .github/workflows/apply-goway-v182-fix4.yml .github/workflows/apply-goway-v182-fix5.yml .github/workflows/apply-goway-finalize.yml 2>/dev/null || true
          git add -A
          git diff --cached --quiet || git commit -m "fix: finalize goway v1.8.2 mux backpressure [skip ci]"
          git push
