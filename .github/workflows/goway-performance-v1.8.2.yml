name: GoWay v1.8.6 Performance Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'goway/goway.go'
      - '.github/workflows/goway-performance-v1.8.2.yml'
  pull_request:
    paths:
      - 'goway/goway.go'
      - '.github/workflows/goway-performance-v1.8.2.yml'

jobs:
  throughput:
    name: '${{ matrix.name }}'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mux-1
            args: '-mux -mux-sessions 1'
            patch: 'none'
          - name: mux-4
            args: '-mux -mux-sessions 4'
            patch: 'none'
          - name: mux-8
            args: '-mux -mux-sessions 8'
            patch: 'none'
          - name: no-mux
            args: '-no-mux'
            patch: 'none'
          - name: mux-1-60k
            args: '-mux -mux-sessions 1'
            patch: '60k'
          - name: mux-4-60k
            args: '-mux -mux-sessions 4'
            patch: '60k'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: goway/go.mod
      - name: Build and benchmark
        shell: pwsh
        working-directory: goway
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.patch }}' -eq '60k') {
            $sourcePath = Join-Path (Get-Location) 'goway.go'
            $source = Get-Content -Raw -Path $sourcePath
            $old = 'const maxChunk = 32 * 1024'
            $new = 'const maxChunk = 60 * 1024'
            if (-not $source.Contains($old)) { throw "Expected Mux chunk constant not found" }
            $source = $source.Replace($old, $new)
            Set-Content -Path $sourcePath -Value $source -NoNewline
            Write-Host 'Applied benchmark-only candidate: Mux maxChunk 32KB -> 60KB'
          }
          go version
          go build -trimpath -ldflags='-s -w' -o goway-bench.exe goway.go

          $root = Join-Path $env:RUNNER_TEMP 'goway-bench-http'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $file = Join-Path $root 'payload.bin'
          $size = 512MB
          $fs = [System.IO.File]::Create($file)
          try { $fs.SetLength($size) } finally { $fs.Dispose() }

          $httpLog = Join-Path $env:RUNNER_TEMP 'goway-http.log'
          $httpErr = Join-Path $env:RUNNER_TEMP 'goway-http.err.log'
          $serverLog = Join-Path $env:RUNNER_TEMP 'goway-server.log'
          $serverErr = Join-Path $env:RUNNER_TEMP 'goway-server.err.log'
          $clientLog = Join-Path $env:RUNNER_TEMP 'goway-client.log'
          $clientErr = Join-Path $env:RUNNER_TEMP 'goway-client.err.log'

          $http = Start-Process python -ArgumentList @('-m','http.server','18000','--bind','127.0.0.1','--directory',$root) -RedirectStandardOutput $httpLog -RedirectStandardError $httpErr -PassThru
          $server = $null
          $client = $null
          try {
            Start-Sleep -Seconds 2
            if ($http.HasExited) { Get-Content $httpLog -ErrorAction SilentlyContinue; Get-Content $httpErr -ErrorAction SilentlyContinue; throw 'HTTP server exited before benchmark' }
            & curl.exe --fail --silent --show-error --output NUL http://127.0.0.1:18000/payload.bin
            if ($LASTEXITCODE -ne 0) { throw "HTTP target preflight failed: $LASTEXITCODE" }

            $server = Start-Process .\goway-bench.exe -ArgumentList @('-p','127.0.0.1:18880','-k','benchmark','-W','1024','-no-block-local') -RedirectStandardOutput $serverLog -RedirectStandardError $serverErr -PassThru
            $clientArgs = @('-p','127.0.0.1:19080','-up','ws://127.0.0.1:18880','-k','benchmark','-W','1024','-no-block-local')
            $clientArgs += '${{ matrix.args }}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
            $client = Start-Process .\goway-bench.exe -ArgumentList $clientArgs -RedirectStandardOutput $clientLog -RedirectStandardError $clientErr -PassThru

            Start-Sleep -Seconds 4
            if ($server.HasExited) { Get-Content $serverLog -ErrorAction SilentlyContinue; Get-Content $serverErr -ErrorAction SilentlyContinue; throw 'GoWay server exited before benchmark' }
            if ($client.HasExited) { Get-Content $clientLog -ErrorAction SilentlyContinue; Get-Content $clientErr -ErrorAction SilentlyContinue; throw 'GoWay client exited before benchmark' }

            function Invoke-Transfer([string]$name, [string[]]$curlArgs) {
              $beforeServer = Get-Process -Id $server.Id -ErrorAction Stop
              $beforeClient = Get-Process -Id $client.Id -ErrorAction Stop
              $serverCpu0 = $beforeServer.TotalProcessorTime.TotalSeconds
              $clientCpu0 = $beforeClient.TotalProcessorTime.TotalSeconds
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              & curl.exe @curlArgs
              $exitCode = $LASTEXITCODE
              $sw.Stop()
              $afterServer = Get-Process -Id $server.Id -ErrorAction Stop
              $afterClient = Get-Process -Id $client.Id -ErrorAction Stop
              $serverCpu = [Math]::Max(0, $afterServer.TotalProcessorTime.TotalSeconds - $serverCpu0)
              $clientCpu = [Math]::Max(0, $afterClient.TotalProcessorTime.TotalSeconds - $clientCpu0)
              $seconds = [Math]::Max($sw.Elapsed.TotalSeconds, 0.000001)
              $bytes = [double]$size
              $mbps = ($bytes / $seconds) * 8 / 1MB
              $cpuPct = (($serverCpu + $clientCpu) / $seconds) / [Environment]::ProcessorCount * 100
              if ($exitCode -ne 0) { throw "$name curl failed with exit code $exitCode" }
              [PSCustomObject]@{ Test=$name; Seconds=[Math]::Round($seconds,3); Mbps=[Math]::Round($mbps,1); GoWayCPUPercent=[Math]::Round($cpuPct,1); Patch='${{ matrix.patch }}' } | ConvertTo-Json -Compress
            }

            Invoke-Transfer 'direct' @('--fail','--silent','--show-error','--output','NUL','http://127.0.0.1:18000/payload.bin')
            Invoke-Transfer 'goway-socks5' @('--fail','--silent','--show-error','--socks5-hostname','127.0.0.1:19080','--output','NUL','http://127.0.0.1:18000/payload.bin')
          }
          finally {
            Write-Host '=== GoWay server log ==='
            Get-Content $serverLog -ErrorAction SilentlyContinue | Select-Object -Last 120
            Write-Host '=== GoWay server errors ==='
            Get-Content $serverErr -ErrorAction SilentlyContinue | Select-Object -Last 120
            Write-Host '=== GoWay client log ==='
            Get-Content $clientLog -ErrorAction SilentlyContinue | Select-Object -Last 120
            Write-Host '=== GoWay client errors ==='
            Get-Content $clientErr -ErrorAction SilentlyContinue | Select-Object -Last 120
            Write-Host '=== HTTP errors ==='
            Get-Content $httpErr -ErrorAction SilentlyContinue | Select-Object -Last 120
            Write-Host '=== System ==='
            Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors,TotalPhysicalMemory | Format-List
            Get-CimInstance Win32_Processor | Select-Object Name,MaxClockSpeed | Format-List
            foreach ($processId in @($client.Id,$server.Id,$http.Id)) {
              if ($processId) { Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue }
            }
          }
