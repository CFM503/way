name: Apply GoWay v1.8.2 fix v5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source and tests
        shell: python
        run: |
          from pathlib import Path

          src = Path('goway/goway.go')
          s = src.read_text(encoding='utf-8')

          if 'muxStreamIngressQueue' not in s:
              s = s.replace('muxServerStreamBufferLimit = 8 * 1024 * 1024', 'muxServerStreamBufferLimit = 16 * 1024 * 1024\n\tmuxStreamIngressQueue    = 16\n\tmuxPushStallTimeout       = 3 * time.Second', 1)

          # Client MuxStream.
          if '\tingress     chan muxDataFrame' not in s:
              s = s.replace('\treadMu      sync.Mutex\n}', '\treadMu      sync.Mutex\n\tingress     chan muxDataFrame\n}', 1)
          start = s.index('func newMuxStream(')
          end = s.index('func (s *MuxStream) PushEOF()', start)
          s = s[:start] + r'''func newMuxStream(id uint32, session MuxSessionInterface) *MuxStream {
	st := &MuxStream{
		id:       id,
		session:  session,
		readChan: make(chan muxDataFrame, 128),
		closed:   make(chan struct{}),
		hasSpace: make(chan struct{}, 1),
		ingress:  make(chan muxDataFrame, muxStreamIngressQueue),
	}
	go st.deliveryLoop()
	return st
}

func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
	select {
	case <-s.closed:
		frame.release()
		return false
	case s.ingress <- frame:
		return true
	default:
		logWarn("[MUX] Stream %d ingress queue full, resetting stream", s.id)
		frame.release()
		s.Reset()
		return false
	}
}

func (s *MuxStream) deliveryLoop() {
	for {
		select {
		case <-s.closed:
			return
		case frame := <-s.ingress:
			if !s.PushDataFrame(frame) {
				frame.release()
			}
		}
	}
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
	dataLen := int64(len(frame.data))
	deadline := time.NewTimer(muxPushStallTimeout)
	defer deadline.Stop()

	for {
		s.bufMu.Lock()
		select {
		case <-s.closed:
			s.bufMu.Unlock()
			return false
		default:
		}
		if frame.data == nil {
			s.readClosed.Store(true)
		}
		if s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
			select {
			case s.readChan <- frame:
				s.queuedBytes += dataLen
				s.bufMu.Unlock()
				return true
			default:
			}
		}
		s.bufMu.Unlock()
		select {
		case <-s.closed:
			return false
		case <-s.hasSpace:
			continue
		case <-deadline.C:
			logWarn("[MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
			s.Reset()
			return false
		}
	}
}

''' + s[end:]

          # Client read-loop delivery and FIN.
          old = 'if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t}'
          if old in s:
              s = s.replace(old, 'st.enqueueDataFrame(frame)', 1)
          s = s.replace('case MuxCmdFIN:\n\t\t\tst.PushEOF()', 'case MuxCmdFIN:\n\t\t\tst.enqueueDataFrame(muxDataFrame{data: nil})', 1)

          # Server MuxStream.
          marker = '\tqueuedBytes int64\n\thasSpace    chan struct{}\n}'
          if marker in s and '\tingress     chan muxDataFrame' not in s[s.index('type MuxServerStream struct'):s.index('func newMuxServerStream(')]:
              s = s.replace(marker, '\tqueuedBytes int64\n\thasSpace    chan struct{}\n\tingress     chan muxDataFrame\n}', 1)
          start = s.index('func newMuxServerStream(')
          end = s.index('func (s *MuxServerStream) consumedBytes', start)
          s = s[:start] + r'''func newMuxServerStream(id uint32, session *MuxServerSession) *MuxServerStream {
	st := &MuxServerStream{
		id:        id,
		session:   session,
		writeChan: make(chan muxDataFrame, 256),
		closed:    make(chan struct{}),
		hasSpace:  make(chan struct{}, 1),
		ingress:   make(chan muxDataFrame, muxStreamIngressQueue),
	}
	go st.deliveryLoop()
	return st
}

func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
	select {
	case <-s.closed:
		frame.release()
		return false
	case s.ingress <- frame:
		return true
	default:
		logWarn("[SERVER-MUX] Stream %d ingress queue full, resetting stream", s.id)
		frame.release()
		s.Close()
		_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
		return false
	}
}

func (s *MuxServerStream) deliveryLoop() {
	for {
		select {
		case <-s.closed:
			return
		case frame := <-s.ingress:
			if !s.PushDataFrame(frame) {
				frame.release()
			}
		}
	}
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
	dataLen := int64(len(frame.data))
	deadline := time.NewTimer(muxPushStallTimeout)
	defer deadline.Stop()

	for {
		s.bufMu.Lock()
		select {
		case <-s.closed:
			s.bufMu.Unlock()
			return false
		default:
		}
		if s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
			select {
			case s.writeChan <- frame:
				s.queuedBytes += dataLen
				s.bufMu.Unlock()
				return true
			default:
			}
		}
		s.bufMu.Unlock()
		select {
		case <-s.closed:
			return false
		case <-s.hasSpace:
			continue
		case <-deadline.C:
			logWarn("[SERVER-MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
			s.Close()
			_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
			return false
		}
	}
}

''' + s[end:]

          # Server read-loop delivery and FIN.
          old = 'if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tsession.streamsMu.Lock()\n\t\t\t\t\tdelete(session.streams, streamID)\n\t\t\t\t\tsession.streamsMu.Unlock()\n\t\t\t\t}'
          if old in s:
              s = s.replace(old, 'st.enqueueDataFrame(frame)', 1)
          old = 'if !st.PushDataFrame(muxDataFrame{data: nil}) {\n\t\t\t\tsession.streamsMu.Lock()\n\t\t\t\tdelete(session.streams, streamID)\n\t\t\t\tsession.streamsMu.Unlock()\n\t\t\t}'
          if old in s:
              s = s.replace(old, 'st.enqueueDataFrame(muxDataFrame{data: nil})', 1)

          # 512 KiB pooled relay buffer cap.
          s = s.replace('if bufSize > 256*1024+14+MuxHeaderLen {', 'if bufSize > 512*1024+14+MuxHeaderLen {', 1)
          s = s.replace('bufSize = 256*1024+14+MuxHeaderLen', 'bufSize = 512*1024+14+MuxHeaderLen', 1)

          src.write_text(s, encoding='utf-8')

          # Cross-platform subprocess test binary.
          test = Path('goway/goway_test.go')
          ts = test.read_text(encoding='utf-8')
          if '\t"path/filepath"\n' not in ts:
              ts = ts.replace('\t"os/exec"\n', '\t"os/exec"\n\t"path/filepath"\n', 1)
          helper = r'''func buildTestBinary(t *testing.T) string {
	t.Helper()
	name := "goway-test"
	if runtime.GOOS == "windows" {
		name += ".exe"
	}
	path := filepath.Join(t.TempDir(), name)
	cmd := exec.Command("go", "build", "-o", path, ".")
	out, err := cmd.CombinedOutput()
	if err != nil {
		t.Fatalf("Failed to build goway test binary: %v\n%s", err, out)
	}
	return path
}

'''
          if helper not in ts:
              ts = ts.replace('func TestEndToEndSubprocessIntegration(t *testing.T) {', helper + 'func TestEndToEndSubprocessIntegration(t *testing.T) {', 1)
          ts = ts.replace('serverCmd := exec.Command(".\\goway.exe",', 'serverCmd := exec.Command(binaryPath,', 1)
          if 'binaryPath := buildTestBinary(t)' not in ts:
              ts = ts.replace('\tserverPort := 18880\n\tserverCmd := exec.Command(binaryPath,', '\tbinaryPath := buildTestBinary(t)\n\tserverPort := 18880\n\tserverCmd := exec.Command(binaryPath,', 1)
          ts = ts.replace('clientCmd := exec.Command(".\\goway.exe",', 'clientCmd := exec.Command(binaryPath,', 1)
          test.write_text(ts, encoding='utf-8')

      - name: Format and verify
        run: |
          gofmt -w goway/goway.go goway/goway_test.go
          cd goway
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Commit and cleanup temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goway/goway.go goway/goway_test.go
          git rm -f .github/workflows/apply-goway-v182-fix.yml .github/workflows/apply-goway-v182-fix2.yml .github/workflows/apply-goway-v182-fix3.yml .github/workflows/apply-goway-v182-fix4.yml .github/workflows/apply-goway-v182-fix5.yml || true
          git add -A
          git diff --cached --quiet || git commit -m "fix: isolate mux stream backpressure [skip ci]"
          git push
