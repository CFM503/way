name: GoWay v1.9.2 Actions Smoke Test

on:
  push:
    paths:
      - '.github/workflows/goway-smoke-v1.9.2.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: goway/go.mod
      - name: Build GoWay
        shell: pwsh
        working-directory: goway
        run: |
          $ErrorActionPreference = 'Stop'
          go version
          go build -trimpath -ldflags='-s -w' -o goway-smoke.exe goway.go
          if (-not (Test-Path .\goway-smoke.exe)) { throw 'GoWay build output missing' }
          Write-Host 'GoWay v1.9.2 smoke build passed'
