name: Repair GoWay MUX

on:
  push:
    paths:
      - '.github/workflows/repair-mux.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Repair source
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          # Buffer cap: default 512 KiB, hard max 12 MiB.
          s, n = re.subn(
              r'(if bufSize > 12\*1024\*1024\+14\+MuxHeaderLen \{\n\s*)bufSize = \d+\*1024 \+ 14 \+ MuxHeaderLen',
              r'\g<1>bufSize = 12*1024*1024 + 14 + MuxHeaderLen', s, count=1)
          if n != 1:
              raise SystemExit('buffer cap replacement not found')

          # deadIPs: use a 5-minute cooldown instead of a permanent bool.
          s = s.replace(
              '\tdeadIPs     map[string]bool // IPs that failed during session (permanent until exit)',
              '\tdeadIPs     map[string]time.Time // temporarily suppress failed IPs', 1)
          s = s.replace('\tdeadIPs:     make(map[string]bool),', '\tdeadIPs:     make(map[string]time.Time),', 1)
          old = '''\t// Skip known-dead IPs (permanent for session)\n\tp.mu.Lock()\n\tif p.deadIPs[dialHost] {\n\t\tp.mu.Unlock()\n\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)\n\t}\n\tp.mu.Unlock()'''
          new = '''\t// Skip recently failed IPs, but allow retry after cooldown.\n\tp.mu.Lock()\n\tif until, ok := p.deadIPs[dialHost]; ok {\n\t\tif time.Now().Before(until) {\n\t\t\tp.mu.Unlock()\n\t\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)\n\t\t}\n\t\tdelete(p.deadIPs, dialHost)\n\t}\n\tp.mu.Unlock()'''
          if s.count(old) == 1:
              s = s.replace(old, new, 1)
          old = '''\t\t// Mark IP as dead for session\n\t\tp.mu.Lock()\n\t\tp.deadIPs[dialHost] = true\n\t\tp.mu.Unlock()'''
          new = '''\t\t// Temporarily suppress this IP; retry it after cooldown.\n\t\tp.mu.Lock()\n\t\tp.deadIPs[dialHost] = time.Now().Add(5 * time.Minute)\n\t\tp.mu.Unlock()'''
          if s.count(old) == 1:
              s = s.replace(old, new, 1)
          s = s.replace('connPool.deadIPs[cfg.UpstreamHost] = true', 'connPool.deadIPs[cfg.UpstreamHost] = time.Now().Add(5 * time.Minute)', 1)

          # Client MUX stream: keep public PushDataFrame blocking/backpressure,
          # and add a nonblocking enqueue for the session read loop.
          client_pat = re.compile(r'func \(s \*MuxStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxStream\) PushData\(', re.S)
          client_repl = '''func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxClientStreamBufferLimit {
\t\treturn false
\t}
\tselect {
\tcase s.readChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.readChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\n\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 {
\t\t\tlogWarn("[MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
\t\t\ts.Reset()
\t\t\treturn false
\t\t}
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait {
\t\t\twait = remaining
\t\t}
\t\ttimer := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed:
\t\t\tif !timer.Stop() { <-timer.C }
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\t\tif !timer.Stop() { <-timer.C }
\t\tcase <-timer.C:
\t\t}
\t}
}

func (s *MuxStream) PushData('''
          s, n = client_pat.subn(client_repl, s, count=1)
          if n != 1:
              raise SystemExit('client PushDataFrame replacement failed')

          once(
              '''func (s *MuxStream) PushEOF() {\n\ts.readClosed.Store(true)\n\tselect {\n\tcase <-s.closed:\n\tdefault:\n\t\tselect {\n\t\tcase s.readChan <- muxDataFrame{data: nil}:\n\t\tdefault:\n\t\t}\n\t}\n}''',
              '''func (s *MuxStream) PushEOF() {\n\tif s.readClosed.Swap(true) {\n\t\treturn\n\t}\n\tselect {\n\tcase <-s.closed:\n\t\treturn\n\tdefault:\n\t}\n\tselect {\n\tcase s.hasSpace <- struct{}{}:\n\tdefault:\n\t}\n}''', 'client FIN')

          # Server MUX stream: same public blocking semantics + FIN half-close state.
          server_pat = re.compile(r'func \(s \*MuxServerStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxServerStream\) PushData\(', re.S)
          server_repl = '''func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tcase <-s.fin:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxServerStreamBufferLimit {
\t\treturn false
\t}
\tselect {
\tcase s.writeChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tcase <-s.fin:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.writeChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\n\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 {
\t\t\tlogWarn("[SERVER-MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
\t\t\ts.Close()
\t\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
\t\t\treturn false
\t\t}
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait {
\t\t\twait = remaining
\t\t}
\t\ttimer := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed:
\t\t\tif !timer.Stop() { <-timer.C }
\t\t\treturn false
\t\tcase <-s.fin:
\t\t\tif !timer.Stop() { <-timer.C }
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\t\tif !timer.Stop() { <-timer.C }
\t\tcase <-timer.C:
\t\t}
\t}
}

func (s *MuxServerStream) PushData('''
          s, n = server_pat.subn(server_repl, s, count=1)
          if n != 1:
              raise SystemExit('server PushDataFrame replacement failed')

          once(
              '''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\ttargetConn  net.Conn''',
              '''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\tfin         chan struct{}\n\tfinOnce     sync.Once\n\ttargetConn  net.Conn''', 'server FIN fields')
          once(
              '''\treturn &MuxServerStream{\n\t\tid:        id,\n\t\tsession:   session,\n\t\twriteChan: make(chan muxDataFrame, 256),\n\t\tclosed:    make(chan struct{}),''',
              '''\treturn &MuxServerStream{\n\t\tid:        id,\n\t\tsession:   session,\n\t\twriteChan: make(chan muxDataFrame, 256),\n\t\tfin:       make(chan struct{}),\n\t\tclosed:    make(chan struct{}),''', 'server FIN init')

          marker = '''func (s *MuxServerStream) QueuedBytes() int64 {\n\ts.bufMu.Lock()\n\tdefer s.bufMu.Unlock()\n\treturn s.queuedBytes\n}\n'''
          if marker not in s:
              raise SystemExit('server queued bytes marker missing')
          s = s.replace(marker, marker + '''\nfunc (s *MuxServerStream) PushEOF() {\n\ts.finOnce.Do(func() { close(s.fin) })\n\tselect {\n\tcase s.hasSpace <- struct{}{}:\n\tdefault:\n\t}\n}\n''', 1)

          # Session read loops must never block on an individual stream.
          s = s.replace('if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()', 'if !st.enqueueDataFrame(frame) {\n\t\t\t\t\tframe.release()', 1)
          s = s.replace('if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tsession.streamsMu.Lock()', 'if !st.enqueueDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tst.Close()\n\t\t\t\t\t_ = st.session.SendFrame(st.id, MuxCmdRST, nil)', 1)

          # Client-side FIN already uses PushEOF; server-side FIN must not enqueue nil DATA.
          old_fin = '''\t\tcase MuxCmdFIN:\n\t\t\tsession.streamsMu.RLock()\n\t\t\tst, ok := session.streams[streamID]\n\t\t\tsession.streamsMu.RUnlock()\n\t\t\tif ok {\n\t\t\t\tif !st.PushDataFrame(muxDataFrame{data: nil}) {\n\t\t\t\t\tsession.streamsMu.Lock()\n\t\t\t\t\tdelete(session.streams, streamID)\n\t\t\t\t\tsession.streamsMu.Unlock()\n\t\t\t\t}\n\t\t\t}'''
          new_fin = '''\t\tcase MuxCmdFIN:\n\t\t\tsession.streamsMu.RLock()\n\t\t\tst, ok := session.streams[streamID]\n\t\t\tsession.streamsMu.RUnlock()\n\t\t\tif ok {\n\t\t\t\tst.PushEOF()\n\t\t\t}'''
          if s.count(old_fin) == 1:
              s = s.replace(old_fin, new_fin, 1)

          # Server writer: drain queued DATA after FIN, then half-close target.
          writer_pat = re.compile(r'\tgo func\(\) \{\n\t\tfor \{\n\t\t\tselect \{\n\t\t\tcase <-st\.closed:.*?\n\t\t\t\}\n\t\t\}\n\t\}\(\)', re.S)
          writer_repl = '''\twriteDone := make(chan struct{})
\tgo func() {
\t\tdefer close(writeDone)
\t\tfor {
\t\t\tselect {
\t\t\tcase <-st.closed:
\t\t\t\treturn
\t\t\tcase frame := <-st.writeChan:
\t\t\t\tif frame.data == nil {
\t\t\t\t\tframe.release()
\t\t\t\t\tcontinue
\t\t\t\t}
\t\t\t\tdata := frame.data
\t\t\t\t_, err := targetConn.Write(data)
\t\t\t\tst.consumedBytes(len(data))
\t\t\t\tframe.release()
\t\t\t\tif err != nil {
\t\t\t\t\tst.Close()
\t\t\t\t\treturn
\t\t\t\t}
\t\t\t\tstats.AddBytes(int64(len(data)), 0)
\t\t\tcase <-st.fin:
\t\t\t\tfor {
\t\t\t\t\tselect {
\t\t\t\t\tcase frame := <-st.writeChan:
\t\t\t\t\t\tif frame.data != nil {
\t\t\t\t\t\t\tif _, err := targetConn.Write(frame.data); err != nil {
\t\t\t\t\t\t\t\tframe.release()
\t\t\t\t\t\t\t\tst.Close()
\t\t\t\t\t\t\t\treturn
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\tst.consumedBytes(len(frame.data))
\t\t\t\t\t\t}
\t\t\t\t\t\tframe.release()
\t\t\t\t\tdefault:
\t\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok {
\t\t\t\t\t\t\t_ = tc.CloseWrite()
\t\t\t\t\t\t}
\t\t\t\t\t\treturn
\t\t\t\t\t}
\t\t\t\t}
\t\t\t}
\t\t}
\t}()'''
          s, n = writer_pat.subn(writer_repl, s, count=1)
          if n != 1:
              raise SystemExit('server writer replacement failed')

          # Target EOF: send FIN, then wait for client->target writer to finish draining.
          old_eof = '''\t\tif errRead != nil {\n\t\t\tif errRead == io.EOF {\n\t\t\t\ts.SendFrame(st.id, MuxCmdFIN, nil)\n\t\t\t} else {\n\t\t\t\ts.SendFrame(st.id, MuxCmdRST, nil)\n\t\t\t}\n\t\t\treturn\n\t\t}'''
          new_eof = '''\t\tif errRead != nil {\n\t\t\tif errRead == io.EOF {\n\t\t\t\tif s.SendFrame(st.id, MuxCmdFIN, nil) == nil {\n\t\t\t\t\tselect {\n\t\t\t\t\tcase <-writeDone:\n\t\t\t\t\tcase <-time.After(time.Duration(s.cfg.ConnTimeout) * time.Second):\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\ts.SendFrame(st.id, MuxCmdRST, nil)\n\t\t\t}\n\t\t\treturn\n\t\t}'''
          once(old_eof, new_eof, 'server target EOF coordination')

          p.write_text(s, encoding='utf-8')

      - name: Format
        run: gofmt -w goway/goway.go

      - name: Targeted tests
        working-directory: goway
        run: go test ./... -run 'TestMux|TestConnPool|TestBuffer' -count=1

      - name: Compile and vet
        working-directory: goway
        run: |
          set -euo pipefail
          go test ./... -run '^$'
          go vet ./...

      - name: Commit source and CI
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/goway-ci.yml <<'EOF'
          name: GoWay CI

          on:
            push:
              branches: [ main ]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version: '1.25'
                    cache-dependency-path: goway/go.mod
                - name: Test
                  working-directory: goway
                  run: go test ./...
                - name: Race test
                  working-directory: goway
                  run: go test -race ./...
                - name: Vet
                  working-directory: goway
                  run: go vet ./...
                - name: Build Windows amd64
                  working-directory: goway
                  env:
                    GOOS: windows
                    GOARCH: amd64
                    CGO_ENABLED: '0'
                  run: go build -trimpath -ldflags='-s -w' -o /tmp/goway-windows-amd64.exe .
          EOF
          rm -f .github/workflows/repair-mux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go .github/workflows/goway-ci.yml .github/workflows/repair-mux.yml
          git commit -m 'fix: restore mux backpressure and half-close semantics'
          git push
