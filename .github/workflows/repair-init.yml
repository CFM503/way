name: Repair GoWay initializer

on:
  push:
    paths:
      - '.github/workflows/repair-init.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix deadIPs initializer
        shell: python
        run: |
          from pathlib import Path
          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')
          old = '\tdeadIPs:     make(map[string]bool),'
          new = '\tdeadIPs:     make(map[string]time.Time),'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one initializer, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: correct deadIPs initializer type'
          git push