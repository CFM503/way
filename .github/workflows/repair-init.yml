name: Repair GoWay deadIPs type

on:
  push:
    paths:
      - '.github/workflows/repair-init.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix deadIPs type and initializer
        shell: python
        run: |
          from pathlib import Path
          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('\tdeadIPs     map[string]bool // IPs that failed during session (permanent until exit)',
               '\tdeadIPs     map[string]time.Time // temporarily suppress failed IPs'),
              ('\tdeadIPs:     make(map[string]bool),',
               '\tdeadIPs:     make(map[string]time.Time),'),
          ]
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {n}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Compile check
        working-directory: goway
        run: go test ./... -run '^$'
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make deadIPs type consistent'
          git push
