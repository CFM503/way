name: Repair GoWay deadIPs

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Repair and validate
        shell: python
        run: |
          from pathlib import Path
          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')

          old = '\tdeadIPs:     make(map[string]bool),'
          new = '\tdeadIPs:     make(map[string]time.Time),'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected one deadIPs initializer, got {n}')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Test
        working-directory: goway
        run: |
          gofmt -w goway.go
          go test ./... -run 'TestMux|TestConnPool|TestBuffer' -count=1
          go test ./... -run '^$'
          go vet ./...
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align deadIPs initializer with time-based cooldown [skip ci]'
          git push
