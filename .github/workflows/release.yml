name: Release GOWAY

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  repair:
    name: Repair GoWay source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Patch validated hot-path issues
        shell: python
        run: |
          from pathlib import Path
          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {s.count(old)}')
              s = s.replace(old, new, 1)

          replace_once(
              '\tif bufSize > 12*1024*1024+14+MuxHeaderLen {\n\t\tbufSize = 256*1024 + 14 + MuxHeaderLen\n\t}',
              '\tif bufSize > 12*1024*1024+14+MuxHeaderLen {\n\t\tbufSize = 12*1024*1024 + 14 + MuxHeaderLen\n\t}',
              'buffer cap')

          replace_once(
              '\tdeadIPs     map[string]bool // IPs that failed during session (permanent until exit)',
              '\tdeadIPs     map[string]time.Time // temporarily suppress failed IPs',
              'deadIPs type')

          old = '''\t// Skip known-dead IPs (permanent for session)\n\tp.mu.Lock()\n\tif p.deadIPs[dialHost] {\n\t\tp.mu.Unlock()\n\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)\n\t}\n\tp.mu.Unlock()'''
          new = '''\t// Skip recently failed IPs, but allow retry after cooldown.\n\tp.mu.Lock()\n\tif until, ok := p.deadIPs[dialHost]; ok {\n\t\tif time.Now().Before(until) {\n\t\t\tp.mu.Unlock()\n\t\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)\n\t\t}\n\t\tdelete(p.deadIPs, dialHost)\n\t}\n\tp.mu.Unlock()'''
          replace_once(old, new, 'deadIPs check')

          replace_once(
              '''\t\t// Mark IP as dead for session\n\t\tp.mu.Lock()\n\t\tp.deadIPs[dialHost] = true\n\t\tp.mu.Unlock()''',
              '''\t\t// Temporarily suppress this IP; retry it after cooldown.\n\t\tp.mu.Lock()\n\t\tp.deadIPs[dialHost] = time.Now().Add(5 * time.Minute)\n\t\tp.mu.Unlock()''',
              'deadIPs set')

          replace_once(
              '''\t\t\t\t\t\tconnPool.mu.Lock()\n\t\t\t\t\t\tconnPool.deadIPs[cfg.UpstreamHost] = true\n\t\t\t\t\t\tconnPool.mu.Unlock()''',
              '''\t\t\t\t\t\tconnPool.mu.Lock()\n\t\t\t\t\t\tconnPool.deadIPs[cfg.UpstreamHost] = time.Now().Add(5 * time.Minute)\n\t\t\t\t\t\tconnPool.mu.Unlock()''',
              'startup deadIPs set')

          old = '''func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))'''
          new = '''func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))\n\ts.bufMu.Lock()\n\tdefer s.bufMu.Unlock()\n\tselect {\n\tcase <-s.closed:\n\t\treturn false\n\tdefault:\n\t}\n\tif s.queuedBytes+dataLen > muxClientStreamBufferLimit {\n\t\treturn false\n\t}\n\tselect {\n\tcase s.readChan <- frame:\n\t\ts.queuedBytes += dataLen\n\t\treturn true\n\tdefault:\n\t\treturn false\n\t}\n}\n\nfunc (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))'''
          replace_once(old, new, 'client enqueue')

          replace_once(
              '''func (s *MuxStream) PushEOF() {\n\ts.readClosed.Store(true)\n\tselect {\n\tcase <-s.closed:\n\tdefault:\n\t\tselect {\n\t\tcase s.readChan <- muxDataFrame{data: nil}:\n\t\tdefault:\n\t\t}\n\t}\n}''',
              '''func (s *MuxStream) PushEOF() {\n\tif s.readClosed.Swap(true) {\n\t\treturn\n\t}\n\tselect {\n\tcase <-s.closed:\n\t\treturn\n\tdefault:\n\t}\n\tselect {\n\tcase s.hasSpace <- struct{}{}:\n\tdefault:\n\t}\n}''',
              'client FIN')

          old = '''func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))'''
          new = '''func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))\n\ts.bufMu.Lock()\n\tdefer s.bufMu.Unlock()\n\tselect {\n\tcase <-s.closed:\n\t\treturn false\n\tdefault:\n\t}\n\tif s.queuedBytes+dataLen > muxServerStreamBufferLimit {\n\t\treturn false\n\t}\n\tselect {\n\tcase s.writeChan <- frame:\n\t\ts.queuedBytes += dataLen\n\t\treturn true\n\tdefault:\n\t\treturn false\n\t}\n}\n\nfunc (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {\n\tdataLen := int64(len(frame.data))'''
          replace_once(old, new, 'server enqueue')

          replace_once(
              '''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\ttargetConn  net.Conn''',
              '''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\tfin         chan struct{}\n\tfinOnce     sync.Once\n\ttargetConn  net.Conn''',
              'server FIN fields')

          replace_once(
              '''\treturn &MuxServerStream{\n\t\tid:        id,\n\t\tsession:   session,\n\t\twriteChan: make(chan muxDataFrame, 256),\n\t\tclosed:    make(chan struct{}),''',
              '''\treturn &MuxServerStream{\n\t\tid:        id,\n\t\tsession:   session,\n\t\twriteChan: make(chan muxDataFrame, 256),\n\t\tfin:       make(chan struct{}),\n\t\tclosed:    make(chan struct{}),''',
              'server FIN init')

          marker = '''func (s *MuxServerStream) QueuedBytes() int64 {\n\ts.bufMu.Lock()\n\tdefer s.bufMu.Unlock()\n\treturn s.queuedBytes\n}\n'''
          add = '''func (s *MuxServerStream) PushEOF() {\n\ts.finOnce.Do(func() { close(s.fin) })\n\tselect {\n\tcase s.hasSpace <- struct{}{}:\n\tdefault:\n\t}\n}\n\n'''
          replace_once(marker, marker + '\n' + add, 'server PushEOF')

          replace_once(
              '''\t\tcase MuxCmdDATA:\n\t\t\tif len(payload) > 0 {\n\t\t\t\tframe := muxDataFrame{\n\t\t\t\t\tdata: payload,\n\t\t\t\t\tbPtr: bPtr,\n\t\t\t\t\tpool: s.cfg.BufPool,\n\t\t\t\t}\n\t\t\t\tbPtr = s.cfg.BufPool.Get().(*[]byte)\n\t\t\t\tbuf = *bPtr\n\t\t\t\tif !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t}\n\t\t\t\tstats.AddBytes(0, int64(len(payload)))\n\t\t\t}\n\t\tcase MuxCmdFIN:\n\t\t\tst.PushEOF()''',
              '''\t\tcase MuxCmdDATA:\n\t\t\tif len(payload) > 0 {\n\t\t\t\tframe := muxDataFrame{\n\t\t\t\t\tdata: payload,\n\t\t\t\t\tbPtr: bPtr,\n\t\t\t\t\tpool: s.cfg.BufPool,\n\t\t\t\t}\n\t\t\t\tbPtr = s.cfg.BufPool.Get().(*[]byte)\n\t\t\t\tbuf = *bPtr\n\t\t\t\tif !st.enqueueDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tst.Reset()\n\t\t\t\t}\n\t\t\t\tstats.AddBytes(0, int64(len(payload)))\n\t\t\t}\n\t\tcase MuxCmdFIN:\n\t\t\tst.PushEOF()''',
              'client readLoop isolation')

          old = '''\t\tcase MuxCmdDATA:\n\t\t\tsession.streamsMu.RLock()\n\t\t\tst, ok := session.streams[streamID]\n\t\t\tsession.streamsMu.RUnlock()\n\t\t\tif ok && len(payload) > 0 {\n\t\t\t\tframe := muxDataFrame{\n\t\t\t\t\tdata: payload,\n\t\t\t\t\tbPtr: bPtr,\n\t\t\t\t\tpool: cfg.BufPool,\n\t\t\t\t}\n\t\t\t\tbPtr = cfg.BufPool.Get().(*[]byte)\n\t\t\t\tbuf = *bPtr\n\t\t\t\tif !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tsession.streamsMu.Lock()\n\t\t\t\t\tdelete(session.streams, streamID)\n\t\t\t\t\tsession.streamsMu.Unlock()\n\t\t\t\t}\n\t\t\t}\n\n\t\tcase MuxCmdFIN:\n\t\t\tsession.streamsMu.RLock()\n\t\t\tst, ok := session.streams[streamID]\n\t\t\tsession.streamsMu.RUnlock()\n\t\t\tif ok {\n\t\t\t\tif !st.PushDataFrame(muxDataFrame{data: nil}) {\n\t\t\t\t\tsession.streamsMu.Lock()\n\t\t\t\t\tdelete(session.streams, streamID)\n\t\t\t\t\tsession.streamsMu.Unlock()\n\t\t\t\t}\n\t\t\t}'''
          new = '''\t\tcase MuxCmdDATA:\n\t\t\tsession.streamsMu.RLock()\n\t\t\tst, ok := session.streams[streamID]\n\t\t\tsession.streamsMu.RUnlock()\n\t\t\tif ok && len(payload) > 0 {\n\t\t\t\tframe := muxDataFrame{\n\t\t\t\t\tdata: payload,\n\t\t\t\t\tbPtr: bPtr,\n\t\t\t\t\tpool: cfg.BufPool,\n\t\t\t\t}\n\t\t\t\tbPtr = cfg.BufPool.Get().(*[]byte)\n\t\t\t\tbuf = *bPtr\n\t\t\t\tif !st.enqueueDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tst.Close()\n\t\t\t\t\t_ = st.session.SendFrame(st.id, MuxCmdRST, nil)\n\t\t\t\t}\n\t\t\t}\n\n\t\tcase MuxCmdFIN:\n\t\t\tsession.streamsMu.RLock()\n\t\t\tst, ok := session.streams[streamID]\n\t\t\tsession.streamsMu.RUnlock()\n\t\t\tif ok {\n\t\t\t\tst.PushEOF()\n\t\t\t}'''
          replace_once(old, new, 'server readLoop isolation')

          old = '''\tgo func() {\n\t\tfor {\n\t\t\tselect {\n\t\t\tcase <-st.closed:\n\t\t\t\treturn\n\t\t\tcase frame, ok := <-st.writeChan:\n\t\t\t\tif !ok || frame.data == nil {\n\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok {\n\t\t\t\t\t\ttc.CloseWrite()\n\t\t\t\t\t}\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tdata := frame.data\n\t\t\t\t_, err := targetConn.Write(data)\n\t\t\t\tst.consumedBytes(len(data))\n\t\t\t\tframe.release()\n\t\t\t\tif err != nil {\n\t\t\t\t\tst.Close()\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tstats.AddBytes(int64(len(data)), 0)\n\t\t\t}\n\t\t}\n\t}()'''
          new = '''\twriteDone := make(chan struct{})\n\tgo func() {\n\t\tdefer close(writeDone)\n\t\tfor {\n\t\t\tselect {\n\t\t\tcase <-st.closed:\n\t\t\t\treturn\n\t\t\tcase frame := <-st.writeChan:\n\t\t\t\tif frame.data == nil {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\tdata := frame.data\n\t\t\t\t_, err := targetConn.Write(data)\n\t\t\t\tst.consumedBytes(len(data))\n\t\t\t\tframe.release()\n\t\t\t\tif err != nil {\n\t\t\t\t\tst.Close()\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tstats.AddBytes(int64(len(data)), 0)\n\t\t\tcase <-st.fin:\n\t\t\t\tfor {\n\t\t\t\t\tselect {\n\t\t\t\t\tcase frame := <-st.writeChan:\n\t\t\t\t\t\tif frame.data != nil {\n\t\t\t\t\t\t\t_, _ = targetConn.Write(frame.data)\n\t\t\t\t\t\t\tst.consumedBytes(len(frame.data))\n\t\t\t\t\t\t}\n\t\t\t\t\t\tframe.release()\n\t\t\t\t\tdefault:\n\t\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok {\n\t\t\t\t\t\t\t_ = tc.CloseWrite()\n\t\t\t\t\t\t}\n\t\t\t\t\t\treturn\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}()'''
          replace_once(old, new, 'server half-close writer')

          old = '''\t\tif nr > 0 {\n\t\t\tif errWrite := s.SendFrame(st.id, MuxCmdDATA, readBuf[:nr]); errWrite != nil {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tstats.AddBytes(0, int64(nr))\n\t\t}\n\t\tif errRead != nil {\n\t\t\tif errRead == io.EOF {\n\t\t\t\ts.SendFrame(st.id, MuxCmdFIN, nil)\n\t\t\t} else {\n\t\t\t\ts.SendFrame(st.id, MuxCmdRST, nil)\n\t\t\t}\n\t\t\treturn\n\t\t}'''
          new = '''\t\tif nr > 0 {\n\t\t\tif errWrite := s.SendFrame(st.id, MuxCmdDATA, readBuf[:nr]); errWrite != nil {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tstats.AddBytes(0, int64(nr))\n\t\t}\n\t\tif errRead != nil {\n\t\t\tif errRead == io.EOF {\n\t\t\t\tif s.SendFrame(st.id, MuxCmdFIN, nil) == nil {\n\t\t\t\t\tselect {\n\t\t\t\t\tcase <-writeDone:\n\t\t\t\t\tcase <-time.After(time.Duration(s.cfg.ConnTimeout) * time.Second):\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\ts.SendFrame(st.id, MuxCmdRST, nil)\n\t\t\t}\n\t\t\treturn\n\t\t}'''
          replace_once(old, new, 'server target EOF coordination')

          p.write_text(s, encoding='utf-8')

      - name: Format and test repaired source
        run: |
          set -euo pipefail
          gofmt -w goway/goway.go
          cd goway
          go test ./... -run 'TestMux|TestConnPool|TestBuffer' -count=1
          go test ./... -run '^$'
          go vet ./...

      - name: Restore release workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/release.yml <<'EOF'
          name: Release GOWAY

          on:
            push:
              tags:
                - 'v*'

          permissions:
            contents: write

          jobs:
            verify:
              name: Verify source
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Setup Go
                  uses: actions/setup-go@v5
                  with:
                    go-version: '1.25'
                    cache-dependency-path: goway/go.mod
                - name: Test
                  working-directory: goway
                  run: go test ./...
                - name: Race test
                  working-directory: goway
                  run: go test -race ./...
                - name: Vet
                  working-directory: goway
                  run: go vet ./...

            build:
              name: Build ${{ matrix.name }}
              needs: verify
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  include:
                    - name: Windows amd64
                      goos: windows
                      goarch: amd64
                      output: goway-windows-amd64.exe
                    - name: Debian 12 amd64
                      goos: linux
                      goarch: amd64
                      output: goway-debian12-amd64
                    - name: OpenWrt ARMv7
                      goos: linux
                      goarch: arm
                      goarm: '7'
                      output: goway-openwrt-arm7
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Setup Go
                  uses: actions/setup-go@v5
                  with:
                    go-version: '1.25'
                    cache-dependency-path: goway/go.mod
                - name: Build
                  working-directory: goway
                  env:
                    GOOS: ${{ matrix.goos }}
                    GOARCH: ${{ matrix.goarch }}
                    GOARM: ${{ matrix.goarm }}
                    CGO_ENABLED: '0'
                  shell: bash
                  run: |
                    if [ -z "$GOARM" ]; then unset GOARM; fi
                    go build -trimpath -ldflags='-s -w' -o "../${{ matrix.output }}" .
                    file "../${{ matrix.output }}"
                - name: Upload artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: ${{ matrix.output }}
                    path: ${{ matrix.output }}
                    if-no-files-found: error

            release:
              name: Create GitHub Release
              needs: build
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Download build artifacts
                  uses: actions/download-artifact@v4
                  with:
                    path: artifacts
                - name: Verify artifacts
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -f artifacts/goway-windows-amd64.exe/goway-windows-amd64.exe
                    test -f artifacts/goway-debian12-amd64/goway-debian12-amd64
                    test -f artifacts/goway-openwrt-arm7/goway-openwrt-arm7
                - name: Create Release
                  uses: softprops/action-gh-release@v2
                  with:
                    tag_name: ${{ github.ref_name }}
                    name: GOWAY ${{ github.ref_name }}
                    generate_release_notes: true
                    files: |
                      artifacts/goway-windows-amd64.exe/goway-windows-amd64.exe
                      artifacts/goway-debian12-amd64/goway-debian12-amd64
                      artifacts/goway-openwrt-arm7/goway-openwrt-arm7
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goway/goway.go .github/workflows/release.yml
          git commit -m "fix: harden mux isolation and stream half-close [skip ci]"
          git push