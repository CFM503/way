name: Release GOWAY

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goway:
    name: GOWAY CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod
      - name: Repair and test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cd goway
            go test ./... -count=1
            go test -race ./... -count=1
            go vet ./...
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o goway-windows-amd64.exe .
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o goway-debian12-amd64 .
            GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o goway-openwrt-arm7 .
            exit 0
          fi
          if [[ "${GITHUB_HEAD_COMMIT_MESSAGE:-}" == *"[skip ci]"* ]]; then exit 0; fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')

          # Buffer hard max fallback: 12 MiB.
          s = s.replace('bufSize = 256*1024 + 14 + MuxHeaderLen', 'bufSize = 12*1024*1024 + 14 + MuxHeaderLen')

          # deadIPs field/initializer and assignments.
          s = s.replace('\tdeadIPs     map[string]bool // IPs that failed during session (permanent until exit)',
                        '\tdeadIPs     map[string]time.Time // temporarily suppress failed IPs', 1)
          s = s.replace('\tdeadIPs:     make(map[string]bool),',
                        '\tdeadIPs:     make(map[string]time.Time),', 1)
          s = s.replace('p.deadIPs[dialHost] = true',
                        'p.deadIPs[dialHost] = time.Now().Add(5 * time.Minute)')
          s = s.replace('connPool.deadIPs[cfg.UpstreamHost] = true',
                        'connPool.deadIPs[cfg.UpstreamHost] = time.Now().Add(5 * time.Minute)')

          # Replace only the exact dead-IP check block.
          old = '''\t// Skip known-dead IPs (permanent for session)
\tp.mu.Lock()
\tif p.deadIPs[dialHost] {
\t\tp.mu.Unlock()
\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)
\t}
\tp.mu.Unlock()'''
          new = '''\t// Skip recently failed IPs, but allow retry after cooldown.
\tp.mu.Lock()
\tif until, ok := p.deadIPs[dialHost]; ok {
\t\tif time.Now().Before(until) {
\t\t\tp.mu.Unlock()
\t\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)
\t\t}
\t\tdelete(p.deadIPs, dialHost)
\t}
\tp.mu.Unlock()'''
          if old in s:
              s = s.replace(old, new, 1)

          # Client MUX stream: public PushDataFrame remains bounded blocking,
          # while session readLoop uses enqueueDataFrame.
          cpat = re.compile(r'func \(s \*MuxStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxStream\) PushData\(', re.S)
          crepl = '''func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect { case <-s.closed: return false; default: }
\tif s.queuedBytes+dataLen > muxClientStreamBufferLimit { return false }
\tselect { case s.readChan <- frame: s.queuedBytes += dataLen; return true; default: return false }
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect { case <-s.closed: s.bufMu.Unlock(); return false; default: }
\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
\t\t\tselect { case s.readChan <- frame: s.queuedBytes += dataLen; s.bufMu.Unlock(); return true; default: }
\t\t}
\t\ts.bufMu.Unlock()
\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 { s.Reset(); return false }
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait { wait = remaining }
\t\tt := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed: if !t.Stop() { <-t.C }; return false
\t\tcase <-s.hasSpace: if !t.Stop() { <-t.C }
\t\tcase <-t.C:
\t\t}
\t}
}

func (s *MuxStream) PushData('''
          s, n = cpat.subn(crepl, s, count=1)
          if n != 1: raise SystemExit(f'client PushDataFrame replacement: {n}')
          s = re.sub(r'func \(s \*MuxStream\) PushEOF\(\) \{.*?\n\}', '''func (s *MuxStream) PushEOF() {
\tif s.readClosed.Swap(true) { return }
\tselect { case <-s.closed: return; default: }
\tselect { case s.hasSpace <- struct{}{}: default: }
}''', s, count=1, flags=re.S)

          # Server MUX stream: public bounded blocking + nonblocking enqueue.
          spat = re.compile(r'func \(s \*MuxServerStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxServerStream\) PushData\(', re.S)
          srepl = '''func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect { case <-s.closed: return false; default: }
\tif s.queuedBytes+dataLen > muxServerStreamBufferLimit { return false }
\tselect { case s.writeChan <- frame: s.queuedBytes += dataLen; return true; default: return false }
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect { case <-s.closed: s.bufMu.Unlock(); return false; default: }
\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
\t\t\tselect { case s.writeChan <- frame: s.queuedBytes += dataLen; s.bufMu.Unlock(); return true; default: }
\t\t}
\t\ts.bufMu.Unlock()
\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 { s.Close(); _ = s.session.SendFrame(s.id, MuxCmdRST, nil); return false }
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait { wait = remaining }
\t\tt := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed: if !t.Stop() { <-t.C }; return false
\t\tcase <-s.hasSpace: if !t.Stop() { <-t.C }
\t\tcase <-t.C:
\t\t}
\t}
}

func (s *MuxServerStream) PushData('''
          s, n = spat.subn(srepl, s, count=1)
          if n != 1: raise SystemExit(f'server PushDataFrame replacement: {n}')

          p.write_text(s, encoding='utf-8')
          PY

          cd goway
          gofmt -w goway.go
          go test ./... -run 'TestMux|TestConnPool|TestBuffer' -count=1
          go test ./... -run '^$'
          go vet ./...
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden goway mux backpressure [skip ci]'
          git push
