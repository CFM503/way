name: Release GOWAY

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Test
        working-directory: goway
        run: go test ./...

      - name: Race test
        working-directory: goway
        run: go test -race ./...

      - name: Vet
        working-directory: goway
        run: go vet ./...

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            goos: windows
            goarch: amd64
            output: goway-windows-amd64.exe
          - name: Debian 12 amd64
            goos: linux
            goarch: amd64
            output: goway-debian12-amd64
          - name: OpenWrt ARMv7
            goos: linux
            goarch: arm
            goarm: '7'
            output: goway-openwrt-arm7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Build
        working-directory: goway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          if [ -z "$GOARM" ]; then unset GOARM; fi
          go build -trimpath -ldflags='-s -w' -o "../${{ matrix.output }}" .
          file "../${{ matrix.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/goway-windows-amd64.exe/goway-windows-amd64.exe
          test -f artifacts/goway-debian12-amd64/goway-debian12-amd64
          test -f artifacts/goway-openwrt-arm7/goway-openwrt-arm7
          find artifacts -type f -maxdepth 2 -print

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GOWAY ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/goway-windows-amd64.exe/goway-windows-amd64.exe
            artifacts/goway-debian12-amd64/goway-debian12-amd64
            artifacts/goway-openwrt-arm7/goway-openwrt-arm7
