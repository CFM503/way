name: Release GOWAY

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  repair:
    name: Repair GoWay source
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Repair source deterministically
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')

          def sub_once(pattern, repl, label, flags=re.S):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              s = s2

          # Buffer: hard cap is 12 MiB; preserve the 512 KiB default flag.
          s = re.sub(r'(if bufSize > 12\*1024\*1024\+14\+MuxHeaderLen \{\s*)bufSize = \d+\*1024 \+ 14 \+ MuxHeaderLen',
                     r'\g<1>bufSize = 12*1024*1024 + 14 + MuxHeaderLen', s, count=1)

          # ConnPool dead IPs use an expiring cooldown map.
          s = re.sub(r'deadIPs\s+map[string](?:bool|time\.Time)(?:\s+//[^\n]*)?',
                     'deadIPs     map[string]time.Time // temporarily suppress failed IPs', s, count=1)
          s = re.sub(r'deadIPs:\s+make\(map\[string\](?:bool|time\.Time)\)',
                     'deadIPs:     make(map[string]time.Time)', s, count=1)
          s = s.replace('connPool.deadIPs[cfg.UpstreamHost] = true',
                        'connPool.deadIPs[cfg.UpstreamHost] = time.Now().Add(5 * time.Minute)')
          s = re.sub(r'p\.deadIPs\[dialHost\]\s*=\s*true',
                     'p.deadIPs[dialHost] = time.Now().Add(5 * time.Minute)', s)
          s = re.sub(
              r'// Skip known-dead IPs \(permanent for session\)\n\tp\.mu\.Lock\(\)\n\tif p\.deadIPs\[dialHost\] \{\n\t\tp\.mu\.Unlock\(\)\n\t\treturn p\.tryFallbackDial\(dialer, wsHost, wsPort, sniHostname\)\n\t\}\n\tp\.mu\.Unlock\(\)',
              '// Skip recently failed IPs, but allow retry after cooldown.\n\tp.mu.Lock()\n\tif until, ok := p.deadIPs[dialHost]; ok {\n\t\tif time.Now().Before(until) {\n\t\t\tp.mu.Unlock()\n\t\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)\n\t\t}\n\t\tdelete(p.deadIPs, dialHost)\n\t}\n\tp.mu.Unlock()', s, count=1)

          # Client stream: nonblocking enqueue for session readLoop, bounded blocking public API.
          client_pat = r'func \(s \*MuxStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxStream\) PushData\('
          client_repl = '''func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxClientStreamBufferLimit {
\t\treturn false
\t}
\tselect {
\tcase s.readChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.readChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 { s.Reset(); return false }
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait { wait = remaining }
\t\tt := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed:
\t\t\tif !t.Stop() { <-t.C }
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\t\tif !t.Stop() { <-t.C }
\t\tcase <-t.C:
\t\t}
\t}
}

func (s *MuxStream) PushData('''
          s, n = re.subn(client_pat, client_repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('client PushDataFrame replacement failed')

          s = re.sub(r'func \(s \*MuxStream\) PushEOF\(\) \{.*?\n\}',
                     '''func (s *MuxStream) PushEOF() {
\tif s.readClosed.Swap(true) { return }
\tselect {
\tcase <-s.closed:
\t\treturn
\tdefault:
\t}
\tselect { case s.hasSpace <- struct{}{}: default: }
}''', s, count=1, flags=re.S)

          # Server stream: same public backpressure model plus FIN state.
          server_pat = r'func \(s \*MuxServerStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxServerStream\) PushData\('
          server_repl = '''func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tcase <-s.fin:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxServerStreamBufferLimit { return false }
\tselect {
\tcase s.writeChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock(); return false
\t\tcase <-s.fin:
\t\t\ts.bufMu.Unlock(); return false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.writeChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock(); return true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 {
\t\t\ts.Close(); _ = s.session.SendFrame(s.id, MuxCmdRST, nil); return false
\t\t}
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait { wait = remaining }
\t\tt := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed:
\t\t\tif !t.Stop() { <-t.C }; return false
\t\tcase <-s.fin:
\t\t\tif !t.Stop() { <-t.C }; return false
\t\tcase <-s.hasSpace:
\t\t\tif !t.Stop() { <-t.C }
\t\tcase <-t.C:
\t\t}
\t}
}

func (s *MuxServerStream) PushData('''
          s, n = re.subn(server_pat, server_repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('server PushDataFrame replacement failed')

          if 'fin         chan struct{}' not in s:
              s = s.replace('''type MuxServerStream struct {
\tid          uint32
\tsession     *MuxServerSession
\twriteChan   chan muxDataFrame
\ttargetConn  net.Conn''', '''type MuxServerStream struct {
\tid          uint32
\tsession     *MuxServerSession
\twriteChan   chan muxDataFrame
\tfin         chan struct{}
\tfinOnce     sync.Once
\ttargetConn  net.Conn''', 1)
          s = s.replace('''\treturn &MuxServerStream{
\t\tid:        id,
\t\tsession:   session,
\t\twriteChan: make(chan muxDataFrame, 256),
\t\tclosed:    make(chan struct{}),''', '''\treturn &MuxServerStream{
\t\tid:        id,
\t\tsession:   session,
\t\twriteChan: make(chan muxDataFrame, 256),
\t\tfin:       make(chan struct{}),
\t\tclosed:    make(chan struct{}),''', 1)
          if 'func (s *MuxServerStream) PushEOF()' not in s:
              marker = '''func (s *MuxServerStream) QueuedBytes() int64 {
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\treturn s.queuedBytes
}
'''
              if marker not in s: raise SystemExit('server queued bytes marker missing')
              s = s.replace(marker, marker + '''
func (s *MuxServerStream) PushEOF() {
\ts.finOnce.Do(func() { close(s.fin) })
\tselect { case s.hasSpace <- struct{}{}: default: }
}
''', 1)

          # Session loops: never block the entire MUX session on one stream.
          s = s.replace('if !st.PushDataFrame(frame) {', 'if !st.enqueueDataFrame(frame) {', 2)
          s = s.replace('''\t\tcase MuxCmdFIN:
\t\t\tsession.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok {
\t\t\t\tif !st.PushDataFrame(muxDataFrame{data: nil}) {
\t\t\t\t\tsession.streamsMu.Lock()
\t\t\t\t\tdelete(session.streams, streamID)
\t\t\t\t\tsession.streamsMu.Unlock()
\t\t\t\t}
\t\t\t}''', '''\t\tcase MuxCmdFIN:
\t\t\tsession.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok { st.PushEOF() }''', 1)

          # Server writer: drain DATA after FIN, then half-close target.
          writer_pat = r'\tgo func\(\) \{\n\t\tfor \{\n\t\t\tselect \{\n\t\t\tcase <-st\.closed:.*?\n\t\t\t\}\n\t\t\}\n\t\}\(\)'
          writer_repl = '''\twriteDone := make(chan struct{})
\tgo func() {
\t\tdefer close(writeDone)
\t\tfor {
\t\t\tselect {
\t\t\tcase <-st.closed:
\t\t\t\treturn
\t\t\tcase frame := <-st.writeChan:
\t\t\t\tif frame.data == nil { frame.release(); continue }
\t\t\t\tdata := frame.data
\t\t\t\t_, err := targetConn.Write(data)
\t\t\t\tst.consumedBytes(len(data))
\t\t\t\tframe.release()
\t\t\t\tif err != nil { st.Close(); return }
\t\t\t\tstats.AddBytes(int64(len(data)), 0)
\t\t\tcase <-st.fin:
\t\t\t\tfor {
\t\t\t\t\tselect {
\t\t\t\t\tcase frame := <-st.writeChan:
\t\t\t\t\t\tif frame.data != nil { _, _ = targetConn.Write(frame.data); st.consumedBytes(len(frame.data)) }
\t\t\t\t\t\tframe.release()
\t\t\t\t\tdefault:
\t\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok { _ = tc.CloseWrite() }
\t\t\t\t\t\treturn
\t\t\t\t\t}
\t\t\t\t}
\t\t\t}
\t\t}
\t}()'''
          if re.search(writer_pat, s, re.S):
              s, n = re.subn(writer_pat, writer_repl, s, count=1, flags=re.S)
              if n != 1: raise SystemExit('server writer replacement failed')

          eof_old = '''\t\tif errRead != nil {
\t\t\tif errRead == io.EOF {
\t\t\t\ts.SendFrame(st.id, MuxCmdFIN, nil)
\t\t\t} else {
\t\t\t\ts.SendFrame(st.id, MuxCmdRST, nil)
\t\t\t}
\t\t\treturn
\t\t}'''
          eof_new = '''\t\tif errRead != nil {
\t\t\tif errRead == io.EOF {
\t\t\t\tif s.SendFrame(st.id, MuxCmdFIN, nil) == nil {
\t\t\t\t\tselect { case <-writeDone: case <-time.After(time.Duration(s.cfg.ConnTimeout) * time.Second): }
\t\t\t\t}
\t\t\t} else { s.SendFrame(st.id, MuxCmdRST, nil) }
\t\t\treturn
\t\t}'''
          if eof_old in s:
              s = s.replace(eof_old, eof_new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate repaired source
        working-directory: goway
        run: |
          gofmt -w goway.go
          go test ./... -run 'TestMux|TestConnPool|TestBuffer' -count=1
          go test ./... -run '^$'
          go vet ./...

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden goway mux backpressure and half-close [skip ci]'
          git push

  verify:
    name: Verify GOWAY release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Full verification
        working-directory: goway
        run: |
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

      - name: Build Windows amd64
        working-directory: goway
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o goway-windows-amd64.exe .

      - name: Build Debian amd64
        working-directory: goway
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o goway-debian12-amd64 .

      - name: Build OpenWrt ARMv7
        working-directory: goway
        run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o goway-openwrt-arm7 .
