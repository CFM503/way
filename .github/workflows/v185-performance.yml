name: v1.8.5 performance validation

on:
  push:
    branches: [v1.8.5-performance]

concurrency:
  group: v1.8.5-performance-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deterministic A/B SendFrame benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/goway-ab
          make_bench() {
            cat > goway/v185_ab_bench_test.go <<'EOF'
          package main
          import (
            "io"
            "net"
            "sync"
            "testing"
            "time"
          )
          type benchConn struct{}
          func (benchConn) Read([]byte) (int,error) { return 0, io.EOF }
          func (benchConn) Write(p []byte) (int,error) { return len(p),nil }
          func (benchConn) Close() error { return nil }
          func (benchConn) LocalAddr() net.Addr { return benchAddr{} }
          func (benchConn) RemoteAddr() net.Addr { return benchAddr{} }
          func (benchConn) SetDeadline(time.Time) error { return nil }
          func (benchConn) SetReadDeadline(time.Time) error { return nil }
          func (benchConn) SetWriteDeadline(time.Time) error { return nil }
          type benchAddr struct{}
          func (benchAddr) Network() string { return "bench" }
          func (benchAddr) String() string { return "bench" }
          var _ = sync.Pool{}
          EOF
          }

          git checkout --detach v1.8.4
          make_bench
          cat >> goway/v185_ab_bench_test.go <<'EOF'
          func BenchmarkSendFrameAB(b *testing.B) {
            pool := &sync.Pool{New: func() interface{} { x := make([]byte, 16*1024+14); return &x }}
            s := &MuxClientSession{wsConn: benchConn{}, cfg: &Config{BufPool: pool}, streams: map[uint32]*MuxStream{}, closed: make(chan struct{}), prng: maskPool.Get().(*maskPRNG)}
            payload := make([]byte, 16*1024)
            b.SetBytes(int64(len(payload)))
            b.ResetTimer()
            for i := 0; i < b.N; i++ { if err := s.SendFrame(1, MuxCmdDATA, payload); err != nil { b.Fatal(err) } }
            b.StopTimer()
            s.Close()
          }
          EOF
          (cd goway && timeout 120s go test -c -o /tmp/v184.test . && timeout 60s /tmp/v184.test -test.run='^$' -test.bench='^BenchmarkSendFrameAB$' -test.benchmem -test.benchtime=200ms -test.count=3) | tee /tmp/goway-ab/v184.txt

          git checkout --detach v1.8.5-performance
          make_bench
          cat >> goway/v185_ab_bench_test.go <<'EOF'
          func BenchmarkSendFrameAB(b *testing.B) {
            pool := &sync.Pool{New: func() interface{} { x := make([]byte, 16*1024+14); return &x }}
            conn := benchConn{}
            s := &MuxClientSession{wsConn: conn, cfg: &Config{BufPool: pool}, streams: map[uint32]*MuxStream{}, closed: make(chan struct{}), prng: maskPool.Get().(*maskPRNG)}
            s.writer = newMuxOutboundWriter(conn, s.prng)
            payload := make([]byte, 16*1024)
            b.SetBytes(int64(len(payload)))
            b.ResetTimer()
            for i := 0; i < b.N; i++ { if err := s.SendFrame(1, MuxCmdDATA, payload); err != nil { b.Fatal(err) } }
            b.StopTimer()
            s.Close()
          }
          EOF
          (cd goway && timeout 120s go test -c -o /tmp/v185.test . && timeout 60s /tmp/v185.test -test.run='^$' -test.bench='^BenchmarkSendFrameAB$' -test.benchmem -test.benchtime=200ms -test.count=3) | tee /tmp/goway-ab/v185.txt

          echo '===== v1.8.4 ====='
          cat /tmp/goway-ab/v184.txt
          echo '===== v1.8.5-performance ====='
          cat /tmp/goway-ab/v185.txt

      - name: Correctness and race stress
        working-directory: goway
        run: |
          go test ./... -count=5 -timeout=8m
          go test -race ./... -count=3 -timeout=8m
          go vet ./...

      - name: Windows x64 build
        working-directory: goway
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/goway-v185-performance.exe .

      - name: Final status
        run: echo 'v1.8.5-performance validation completed successfully.'
