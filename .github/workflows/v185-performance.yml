name: v1.8.5 performance validation

on:
  push:
    branches: [v1.8.5-performance]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A/B benchmark v1.8.4 vs v1.8.5-performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/goway-ab
          git checkout --detach v1.8.4
          cd goway
          go test -run '^$' ./...
          go test -bench='BenchmarkMuxDataTransferPooled' -benchmem -count=10 ./... | tee /tmp/goway-ab/v184.txt
          cd ..
          git checkout --detach v1.8.5-performance
          cd goway
          go test -run '^$' ./...
          go test -bench='BenchmarkMuxDataTransferPooled' -benchmem -count=10 ./... | tee /tmp/goway-ab/v185.txt
          echo '=== v1.8.4 ==='
          cat /tmp/goway-ab/v184.txt
          echo '=== v1.8.5-performance ==='
          cat /tmp/goway-ab/v185.txt

      - name: Full correctness and race validation
        working-directory: goway
        run: |
          go test ./... -count=5 -timeout=10m
          go test -race ./... -count=3 -timeout=10m
          go vet ./...

      - name: Windows x64 build
        working-directory: goway
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/goway-v185-performance.exe .

      - name: Final status
        run: |
          echo 'v1.8.5-performance validation completed successfully.'
          echo 'A/B benchmark files were generated on the same runner.'
