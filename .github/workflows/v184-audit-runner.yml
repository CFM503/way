name: v1.8.4 deep audit runner

on:
  push:
    branches: [v1.8.4-deep-audit]

permissions:
  contents: write

jobs:
  audit:
    if: "!contains(github.event.head_commit.message, 'Release v1.8.4: deep concurrency and lifecycle audit')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.4-deep-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod
      - name: Patch audited source
        working-directory: goway
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('goway.go')
          s = p.read_text()
          def once(old, new, name):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          once('Version        = "1.8.3"', 'Version        = "1.8.4"', 'version')

          once('''var (\n\tlogFilePath string\n\tlogRingBuf  [10]string\n\tlogRingPos  int\n\tlogRingLen  int\n)''', '''var (\n\tlogFilePath string\n\tlogRingBuf  [10]string\n\tlogRingPos  int\n\tlogRingLen  int\n\tlogRingMu   sync.Mutex\n)''', 'log mutex')

          old = '''func addLogFileEntry(entry string) {\n\tif logFilePath == "" {\n\t\treturn\n\t}\n\tts := time.Now().Format("2006-01-02 15:04:05")\n\tlogRingBuf[logRingPos] = ts + " " + entry\n\tlogRingPos = (logRingPos + 1) % len(logRingBuf)\n\tif logRingLen < len(logRingBuf) {\n\t\tlogRingLen++\n\t}\n\t// Write immediately so logs survive hard kills\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ {\n\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])\n\t}\n\tos.WriteFile(logFilePath, []byte(strings.Join(lines, "\\n")+"\\n"), 0644)\n}\n\nfunc saveLogFile() {\n\tif logFilePath == "" || logRingLen == 0 {\n\t\treturn\n\t}\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ {\n\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])\n\t}\n\tcontent := strings.Join(lines, "\\n") + "\\n"\n\tif err := os.WriteFile(logFilePath, []byte(content), 0644); err != nil {\n\t\tlog.Printf("Failed to save log file: %v", err)\n\t} else {\n\t\tlog.Printf("Log saved to %s (%d entries)", logFilePath, logRingLen)\n\t}\n}'''
          new = '''func addLogFileEntry(entry string) {\n\tlogRingMu.Lock()\n\tdefer logRingMu.Unlock()\n\tif logFilePath == "" {\n\t\treturn\n\t}\n\tts := time.Now().Format("2006-01-02 15:04:05")\n\tlogRingBuf[logRingPos] = ts + " " + entry\n\tlogRingPos = (logRingPos + 1) % len(logRingBuf)\n\tif logRingLen < len(logRingBuf) {\n\t\tlogRingLen++\n\t}\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ {\n\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])\n\t}\n\t_ = os.WriteFile(logFilePath, []byte(strings.Join(lines, "\\n")+"\\n"), 0644)\n}\n\nfunc saveLogFile() {\n\tlogRingMu.Lock()\n\tdefer logRingMu.Unlock()\n\tif logFilePath == "" || logRingLen == 0 {\n\t\treturn\n\t}\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ {\n\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])\n\t}\n\tcontent := strings.Join(lines, "\\n") + "\\n"\n\tif err := os.WriteFile(logFilePath, []byte(content), 0644); err != nil {\n\t\tlog.Printf("Failed to save log file: %v", err)\n\t} else {\n\t\tlog.Printf("Log saved to %s (%d entries)", logFilePath, logRingLen)\n\t}\n}'''
          once(old, new, 'log functions')

          once('''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\ttargetConn  net.Conn\n\tclosed      chan struct{}\n\tcloseOnce   sync.Once''', '''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\ttargetMu    sync.Mutex\n\ttargetConn  net.Conn\n\tclosed      chan struct{}\n\tcloseOnce   sync.Once''', 'target field')

          once('''func (s *MuxServerStream) Close() {\n\ts.closeOnce.Do(func() {\n\t\tclose(s.closed)\n\t\tif s.targetConn != nil {\n\t\t\ts.targetConn.Close()\n\t\t}\n\t\ts.bufMu.Lock()''', '''func (s *MuxServerStream) setTargetConn(conn net.Conn) bool {\n\ts.targetMu.Lock()\n\tdefer s.targetMu.Unlock()\n\tselect {\n\tcase <-s.closed:\n\t\tif conn != nil { _ = conn.Close() }\n\t\treturn false\n\tdefault:\n\t}\n\tif s.targetConn != nil { _ = s.targetConn.Close() }\n\ts.targetConn = conn\n\treturn true\n}\n\nfunc (s *MuxServerStream) closeTargetConn() {\n\ts.targetMu.Lock()\n\tdefer s.targetMu.Unlock()\n\tif s.targetConn != nil {\n\t\t_ = s.targetConn.Close()\n\t\ts.targetConn = nil\n\t}\n}\n\nfunc (s *MuxServerStream) targetConnSnapshot() net.Conn {\n\ts.targetMu.Lock()\n\tdefer s.targetMu.Unlock()\n\treturn s.targetConn\n}\n\nfunc (s *MuxServerStream) Close() {\n\ts.closeOnce.Do(func() {\n\t\tclose(s.closed)\n\t\ts.closeTargetConn()\n\t\ts.bufMu.Lock()''', 'target lifecycle')

          once('''\toptimizeSocket(targetConn, s.cfg)\n\tst.targetConn = targetConn\n\n\tif len(initialData) > 0 {''', '''\toptimizeSocket(targetConn, s.cfg)\n\tif !st.setTargetConn(targetConn) {\n\t\treturn\n\t}\n\n\tif len(initialData) > 0 {''', 'target assignment')

          once('''func readUntilCRLFCRLF(br *bufio.Reader) ([]byte, error) {\n\tvar buf bytes.Buffer\n\tbuf.Grow(MaxHeaderSize)\n\tfor {\n\t\tline, err := br.ReadSlice('\\n')\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tbuf.Write(line)\n\t\tb := buf.Bytes()\n\t\tn := len(b)\n\t\tif n >= 4 &&\n\t\t\tb[n-4] == '\\r' && b[n-3] == '\\n' &&\n\t\t\tb[n-2] == '\\r' && b[n-1] == '\\n' {\n\t\t\treturn b, nil\n\t\t}\n\t\tif n > MaxHeaderSize {\n\t\t\treturn nil, errors.New("header too large")\n\t\t}\n\t}\n}''', '''func readUntilCRLFCRLF(br *bufio.Reader) ([]byte, error) {\n\tvar buf bytes.Buffer\n\tbuf.Grow(MaxHeaderSize)\n\tfor {\n\t\tline, err := br.ReadSlice('\\n')\n\t\tif err == bufio.ErrBufferFull {\n\t\t\treturn nil, errors.New("header too large")\n\t\t}\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tif len(line) > MaxHeaderSize-buf.Len() {\n\t\t\treturn nil, errors.New("header too large")\n\t\t}\n\t\tbuf.Write(line)\n\t\tb := buf.Bytes()\n\t\tn := len(b)\n\t\tif n >= 4 &&\n\t\t\tb[n-4] == '\\r' && b[n-3] == '\\n' &&\n\t\t\tb[n-2] == '\\r' && b[n-1] == '\\n' {\n\t\t\treturn b, nil\n\t\t}\n\t\tif n >= MaxHeaderSize {\n\t\t\treturn nil, errors.New("header too large")\n\t\t}\n\t}\n}''', 'header limit')

          marker = '''\ts.writeMu.Lock()\n\tdefer s.writeMu.Unlock()\n\n\tframeLen := MuxHeaderLen + payloadLen'''
          replacement = '''\ts.writeMu.Lock()\n\tdefer s.writeMu.Unlock()\n\tselect {\n\tcase <-s.closed:\n\t\treturn errors.New("mux session closed")\n\tdefault:\n\t}\n\tprng := s.prng\n\tif prng == nil {\n\t\treturn errors.New("mux session mask generator unavailable")\n\t}\n\n\tframeLen := MuxHeaderLen + payloadLen'''
          start = s.index('func (s *MuxClientSession) SendFrame')
          end = s.index('func (s *MuxClientSession) readLoop', start)
          part = s[start:end]
          if part.count(marker) != 1:
              raise SystemExit('client SendFrame lock marker mismatch')
          part = part.replace(marker, replacement, 1)
          part = part.replace('writeWSFramePreallocatedFast(s.wsConn, buf, frameStart, frameLen, 0x2, s.prng)', 'writeWSFramePreallocatedFast(s.wsConn, buf, frameStart, frameLen, 0x2, prng)', 1)
          s = s[:start] + part + s[end:]

          old_close = '''\t\tfor _, st := range activeStreams {\n\t\t\tst.Reset()\n\t\t}\n\n\t\tif s.prng != nil {\n\t\t\tmaskPool.Put(s.prng)\n\t\t\ts.prng = nil\n\t\t}\n\t})\n}'''
          new_close = '''\t\tfor _, st := range activeStreams {\n\t\t\tst.Reset()\n\t\t}\n\n\t\t// Wait for every SendFrame critical section before returning the PRNG to sync.Pool.\n\t\ts.writeMu.Lock()\n\t\tif s.prng != nil {\n\t\t\tmaskPool.Put(s.prng)\n\t\t\ts.prng = nil\n\t\t}\n\t\ts.writeMu.Unlock()\n\t})\n}'''
          once(old_close, new_close, 'client Close')
          p.write_text(s)
          print('source patch ok')
          PY

          cat > goway_v184_test.go <<'EOF'
          package main

          import (
              "bufio"
              "fmt"
              "io"
              "net"
              "os"
              "strings"
              "sync"
              "testing"
              "time"
          )

          func TestV184HeaderHardLimit(t *testing.T) {
              valid := strings.Repeat("a", MaxHeaderSize-4) + "\r\n\r\n"
              got, err := readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(valid), MaxHeaderSize))
              if err != nil || len(got) != MaxHeaderSize { t.Fatalf("max header: len=%d err=%v", len(got), err) }
              oversized := strings.Repeat("a", MaxHeaderSize+1) + "\r\n\r\n"
              _, err = readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(oversized), MaxHeaderSize))
              if err == nil || err.Error() != "header too large" { t.Fatalf("oversized line err=%v", err) }
              total := strings.Repeat("a", MaxHeaderSize-5) + "\r\n" + "b\r\n\r\n"
              _, err = readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(total), MaxHeaderSize))
              if err == nil || err.Error() != "header too large" { t.Fatalf("oversized total err=%v", err) }
          }

          func TestV184MuxClientPRNGLifecycle(t *testing.T) {
              client, peer := net.Pipe()
              defer peer.Close()
              pool := &sync.Pool{New: func() interface{} { b := make([]byte, 128*1024); return &b }}
              s := &MuxClientSession{wsConn: client, cfg: &Config{BufPool: pool}, streams: make(map[uint32]*MuxStream), closed: make(chan struct{}), prng: maskPool.Get().(*maskPRNG)}
              drainDone := make(chan struct{})
              go func() { _, _ = io.Copy(io.Discard, peer); close(drainDone) }()
              var wg sync.WaitGroup
              payload := make([]byte, 1024)
              for i := 0; i < 16; i++ {
                  wg.Add(1)
                  go func(id int) {
                      defer wg.Done()
                      for j := 0; j < 100; j++ { if s.SendFrame(uint32(id+1), MuxCmdDATA, payload) != nil { return } }
                  }(i)
              }
              closeDone := make(chan struct{})
              go func() { s.Close(); close(closeDone) }()
              wg.Wait()
              select { case <-closeDone: case <-time.After(2*time.Second): t.Fatal("Close hung") }
              _ = client.Close()
              select { case <-drainDone: case <-time.After(2*time.Second): t.Fatal("drain hung") }
              if s.prng != nil { t.Fatal("PRNG not cleared") }
          }

          func TestV184MuxServerTargetLifecycle(t *testing.T) {
              st := newMuxServerStream(1, nil)
              defer st.Close()
              var wg sync.WaitGroup
              for i := 0; i < 64; i++ {
                  wg.Add(1)
                  go func() { defer wg.Done(); c1, c2 := net.Pipe(); _ = c2.Close(); _ = st.setTargetConn(c1); _ = st.targetConnSnapshot(); st.closeTargetConn() }()
              }
              wg.Add(1)
              go func() { defer wg.Done(); st.Close() }()
              wg.Wait()
              if st.targetConnSnapshot() != nil { t.Fatal("targetConn retained after Close") }
          }

          func TestV184SlowAndFastStreams(t *testing.T) {
              slow := newMuxServerStream(1, nil); fast := newMuxServerStream(2, nil)
              defer slow.Close(); defer fast.Close()
              chunk := make([]byte, 64*1024)
              for i := 0; i < muxServerStreamBufferLimit/len(chunk); i++ { if !slow.PushData(chunk) { t.Fatalf("fill failed at %d", i) } }
              blocked := make(chan bool, 1)
              go func() { blocked <- slow.PushData(chunk) }()
              time.Sleep(20*time.Millisecond)
              if !fast.PushData(chunk) { t.Fatal("fast stream blocked by slow stream") }
              select { case f := <-slow.writeChan: f.release(); slow.consumedBytes(len(chunk)); case <-time.After(time.Second): t.Fatal("slow queue did not drain") }
              select { case ok := <-blocked: if !ok { t.Fatal("slow stream did not resume") }; case <-time.After(time.Second): t.Fatal("slow stream stayed blocked") }
          }

          func TestV184ConcurrentStreamCloseRSTEOF(t *testing.T) {
              st := newMuxStream(1, nil)
              var wg sync.WaitGroup
              for i := 0; i < 32; i++ { wg.Add(1); go func(i int) { defer wg.Done(); if i%2==0 { st.PushEOF() } else { st.Reset() } }(i) }
              wg.Wait(); st.Close()
          }

          func TestV184ThousandStreamCreateClose(t *testing.T) {
              streams := make([]*MuxServerStream, 1000)
              for i := range streams { streams[i] = newMuxServerStream(uint32(i+1), nil) }
              var wg sync.WaitGroup; wg.Add(len(streams))
              for _, st := range streams { go func(s *MuxServerStream) { defer wg.Done(); s.Close() }(st) }
              wg.Wait()
          }

          func TestV184ConcurrentLogRingSave(t *testing.T) {
              f, err := os.CreateTemp("", "goway-v184-log-*.log"); if err != nil { t.Fatal(err) }
              path := f.Name(); _ = f.Close(); defer os.Remove(path)
              logRingMu.Lock(); logFilePath = path; logRingBuf=[10]string{}; logRingPos=0; logRingLen=0; logRingMu.Unlock()
              var wg sync.WaitGroup
              for i:=0; i<8; i++ { wg.Add(1); go func(id int){ defer wg.Done(); for j:=0;j<10;j++ { addLogFileEntry(fmt.Sprintf("w=%d n=%d",id,j)) } }(i) }
              for i:=0; i<8; i++ { wg.Add(1); go func(){ defer wg.Done(); for j:=0;j<5;j++ { saveLogFile() } }() }
              wg.Wait(); logRingMu.Lock(); logFilePath=""; logRingMu.Unlock()
          }
          EOF

          gofmt -w goway.go goway_v184_test.go
          go test ./...
          go test -race ./...
          go vet ./...

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../goway-windows-amd64-v184.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../goway-debian12-amd64-v184 .
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../goway-openwrt-arm7-v184 .

          cd ..
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8-sig')
          if '## [v1.8.4]' not in s:
              section='''## [v1.8.4] - 2026-09-11\n\n### Goway 深度并发与生命周期审计\n\n- 修复 `MuxClientSession` PRNG 与 `sync.Pool` 的关闭生命周期竞争；`SendFrame` 在 `writeMu` 内重新检查状态并固定 PRNG，`Close` 等待物理写临界区退出后再归还。\n- 为 `MuxServerStream.targetConn` 增加独立 `targetMu`，保护设置、快照、关闭和清空，不进入数据转发热路径。\n- 强化 `readUntilCRLFCRLF()` 硬上限，超长单行和累计头部均立即返回 `header too large`。\n- 为日志 ring buffer 与保存路径增加并发保护，覆盖并发 WARN/ERROR 与退出保存。\n- 强化并发回归：多 Stream、慢流/快流、RST/EOF、targetConn 并发关闭、1000 Stream 生命周期、PRNG 与日志。\n- 审计确认现有 `writeMu` 会串行化物理 WebSocket `Write`；由于 bounded outbound queue 会改变背压/时序/故障回收语义，本版本不强行重构，保留现有协议与架构并以 stress/race 回归锁定行为。\n\n'''
              p.write_text(s.replace('---\n','---\n\n'+section,1),encoding='utf-8-sig')
          PY

          rm -f .github/workflows/v184-audit-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go goway/goway_v184_test.go CHANGELOG.md .github/workflows/v184-audit-runner.yml
          git diff --cached --check
          git commit -m 'Release v1.8.4: deep concurrency and lifecycle audit'
          git push origin HEAD:v1.8.4-deep-audit
