          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8-sig')
          if '## [v1.8.4]' not in s:
              section = '''## [v1.8.4] - 2026-09-11

### Goway 深度并发与生命周期审计

- **MuxClientSession PRNG 生命周期修复**：`SendFrame()` 在 `writeMu` 临界区内重新检查 session 状态并固定 PRNG 指针；`Close()` 仅在所有物理写出临界区退出后归还 `sync.Pool`，消除关闭与发送并发时的生命周期竞争。
- **MuxServerStream targetConn 生命周期修复**：增加 `targetMu`，集中保护 target 连接的设置、快照、关闭和清空；不把生命周期锁带入数据转发热路径。
- **WebSocket Header 硬上限**：`readUntilCRLFCRLF()` 在写入累计缓冲前检查长度，并将超长单行统一快速拒绝为 `header too large`。
- **日志环并发安全**：`logRingBuf/logRingPos/logRingLen` 与文件保存统一受轻量生命周期锁保护，避免并发 WARN/ERROR 与退出保存发生 race。
- **MUX 并发回归测试强化**：覆盖多 Stream、慢流/快流隔离、RST/EOF 并发、targetConn 并发关闭、1000 Stream 建立/关闭及 PRNG/日志生命周期。
- **MUX 写路径审计结论**：确认当前 `writeMu` 会串行化物理 WebSocket `Write`，因此存在慢物理连接阻塞同一 session 其他 Stream 的结构性风险；考虑到 bounded outbound writer queue 会改变时序、背压与故障回收语义，本版本不强行引入高风险队列重构，改以压力/race 回归锁定现有行为。

'''
              p.write_text(s.replace('---\n', '---\n\n' + section, 1), encoding='utf-8-sig')

      - name: Remove temporary runner before commit
