name: v1.8.4 deep audit runner

on:
  push:
    branches:
      - v1.8.4-deep-audit

permissions:
  contents: write

jobs:
  patch-test-build-commit:
    if: "!contains(github.event.head_commit.message, 'Release v1.8.4: deep concurrency and lifecycle audit')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          ref: v1.8.4-deep-audit
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Apply audited local refactors and tests
        working-directory: goway
        shell: python
        run: |
