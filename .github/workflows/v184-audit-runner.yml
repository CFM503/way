              s = s.replace(old, new, 1)

          replace_once('Version        = "1.8.3"', 'Version        = "1.8.4"', 'version')

          old = '''func addLogFileEntry(entry string) {
\tif logFilePath == "" {
\t\treturn
\t}
\tts := time.Now().Format("2006-01-02 15:04:05")
\tlogRingBuf[logRingPos] = ts + " " + entry
\tlogRingPos = (logRingPos + 1) % len(logRingBuf)
\tif logRingLen < len(logRingBuf) {
\t\tlogRingLen++
\t}
\t// Write immediately so logs survive hard kills
\tvar lines []string
\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)
\tfor i := 0; i < logRingLen; i++ {
\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])
\t}
\tos.WriteFile(logFilePath, []byte(strings.Join(lines, "\\n")+"\\n"), 0644)
}

func saveLogFile() {
\tif logFilePath == "" || logRingLen == 0 {
\t\treturn
\t}
\tvar lines []string
\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)
\tfor i := 0; i < logRingLen; i++ {
\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])
\t}
\tcontent := strings.Join(lines, "\\n") + "\\n"
\tif err := os.WriteFile(logFilePath, []byte(content), 0644); err != nil {
\t\tlog.Printf("Failed to save log file: %v", err)
\t} else {
\t\tlog.Printf("Log saved to %s (%d entries)", logFilePath, logRingLen)
\t}
}'''
          new = '''func addLogFileEntry(entry string) {
\tlogRingMu.Lock()
\tdefer logRingMu.Unlock()
\tif logFilePath == "" {
\t\treturn
\t}
\tts := time.Now().Format("2006-01-02 15:04:05")
\tlogRingBuf[logRingPos] = ts + " " + entry
\tlogRingPos = (logRingPos + 1) % len(logRingBuf)
\tif logRingLen < len(logRingBuf) {
\t\tlogRingLen++
\t}
\t// Serialize ring mutation and snapshot/write so shutdown cannot race log writers.
\tvar lines []string
\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)
\tfor i := 0; i < logRingLen; i++ {
\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])
\t}
\t_ = os.WriteFile(logFilePath, []byte(strings.Join(lines, "\\n")+"\\n"), 0644)
}

func saveLogFile() {
\tlogRingMu.Lock()
\tdefer logRingMu.Unlock()
\tif logFilePath == "" || logRingLen == 0 {
\t\treturn
\t}
\tvar lines []string
\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)
\tfor i := 0; i < logRingLen; i++ {
\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])
\t}
\tcontent := strings.Join(lines, "\\n") + "\\n"
\tif err := os.WriteFile(logFilePath, []byte(content), 0644); err != nil {
\t\tlog.Printf("Failed to save log file: %v", err)
\t} else {
\t\tlog.Printf("Log saved to %s (%d entries)", logFilePath, logRingLen)
\t}
}'''
          replace_once(old, new, 'log functions')

          replace_once('''var (
\tlogFilePath string
\tlogRingBuf  [10]string
\tlogRingPos  int
\tlogRingLen  int
)''', '''var (
\tlogFilePath string
\tlogRingBuf  [10]string
