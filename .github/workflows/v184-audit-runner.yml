}

func (s *MuxServerStream) Close() {
\ts.closeOnce.Do(func() {
\t\tclose(s.closed)
\t\ts.closeTargetConn()
\t\ts.bufMu.Lock()''', 'target lifecycle methods')

          replace_once('''\toptimizeSocket(targetConn, s.cfg)
\tst.targetConn = targetConn

\tif len(initialData) > 0 {''', '''\toptimizeSocket(targetConn, s.cfg)
\tif !st.setTargetConn(targetConn) {
\t\treturn
\t}

\tif len(initialData) > 0 {''', 'target assignment')

          replace_once('''func readUntilCRLFCRLF(br *bufio.Reader) ([]byte, error) {
\tvar buf bytes.Buffer
\tbuf.Grow(MaxHeaderSize)
\tfor {
\t\tline, err := br.ReadSlice('\\n')
\t\tif err != nil {
\t\t\treturn nil, err
\t\t}
\t\tbuf.Write(line)
\t\tb := buf.Bytes()
\t\tn := len(b)
\t\tif n >= 4 &&
\t\t\tb[n-4] == '\\r' && b[n-3] == '\\n' &&
\t\t\tb[n-2] == '\\r' && b[n-1] == '\\n' {
\t\t\treturn b, nil
\t\t}
\t\tif n > MaxHeaderSize {
\t\t\treturn nil, errors.New("header too large")
\t\t}
\t}
}''', '''func readUntilCRLFCRLF(br *bufio.Reader) ([]byte, error) {
\tvar buf bytes.Buffer
\tbuf.Grow(MaxHeaderSize)
\tfor {
\t\tline, err := br.ReadSlice('\\n')
\t\tif err == bufio.ErrBufferFull {
\t\t\treturn nil, errors.New("header too large")
\t\t}
\t\tif err != nil {
\t\t\treturn nil, err
\t\t}
\t\tif len(line) > MaxHeaderSize-buf.Len() {
\t\t\treturn nil, errors.New("header too large")
\t\t}
\t\tbuf.Write(line)
\t\tb := buf.Bytes()
\t\tn := len(b)
\t\tif n >= 4 &&
\t\t\tb[n-4] == '\\r' && b[n-3] == '\\n' &&
\t\t\tb[n-2] == '\\r' && b[n-1] == '\\n' {
\t\t\treturn b, nil
\t\t}
\t\tif n >= MaxHeaderSize {
\t\t\treturn nil, errors.New("header too large")
\t\t}
\t}
}''', 'header limit')

          replace_once('''\ts.writeMu.Lock()
\tdefer s.writeMu.Unlock()

\tframeLen := MuxHeaderLen + payloadLen''', '''\ts.writeMu.Lock()
\tdefer s.writeMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn errors.New("mux session closed")
\tdefault:
\t}
\tprng := s.prng
\tif prng == nil {
\t\treturn errors.New("mux session mask generator unavailable")
\t}

\tframeLen := MuxHeaderLen + payloadLen''', 'client SendFrame lock recheck')

          replace_once('''\treturn writeWSFramePreallocatedFast(s.wsConn, buf, frameStart, frameLen, 0x2, s.prng)
}''', '''\treturn writeWSFramePreallocatedFast(s.wsConn, buf, frameStart, frameLen, 0x2, prng)
}''', 'client PRNG local')

          replace_once('''\t\tfor _, st := range activeStreams {
\t\t\tst.Reset()
\t\t}

\t\tif s.prng != nil {
\t\t\tmaskPool.Put(s.prng)
\t\t\ts.prng = nil
\t\t}
\t})
}''', '''\t\tfor _, st := range activeStreams {
\t\t\tst.Reset()
\t\t}

\t\t// SendFrame holds writeMu for the entire physical write and may have
\t\t// passed the initial closed check before Close started. Do not return the
\t\t// PRNG to the pool until every such writer has left the critical section.
\t\ts.writeMu.Lock()
\t\tif s.prng != nil {
\t\t\tmaskPool.Put(s.prng)
\t\t\ts.prng = nil
\t\t}
\t\ts.writeMu.Unlock()
\t})
}''', 'client PRNG release ordering')

          p.write_text(s, encoding='utf-8')

          # Append focused concurrency/lifecycle tests without weakening existing stress tests.
          tp = Path('goway_test.go')
          t = tp.read_text(encoding='utf-8')
          if 'func TestV184HeaderHardLimit' not in t:
              t = t.replace('''\t"net"\n\t"os/exec"''', '''\t"net"\n\t"os"\n\t"os/exec"''', 1)
              t += r'''

func TestV184HeaderHardLimit(t *testing.T) {
	valid := strings.Repeat("a", MaxHeaderSize-4) + "\r\n\r\n"
	got, err := readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(valid), MaxHeaderSize))
	if err != nil || len(got) != MaxHeaderSize {
		t.Fatalf("max-size header rejected: len=%d err=%v", len(got), err)
	}

	tooLargeLine := strings.Repeat("a", MaxHeaderSize+1) + "\r\n\r\n"
	_, err = readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(tooLargeLine), MaxHeaderSize))
	if err == nil || err.Error() != "header too large" {
		t.Fatalf("oversized line error = %v, want header too large", err)
	}

	oversizedTotal := strings.Repeat("a", MaxHeaderSize-5) + "\r\n" + "b\r\n\r\n"
	_, err = readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(oversizedTotal), MaxHeaderSize))
	if err == nil || err.Error() != "header too large" {
		t.Fatalf("oversized total error = %v, want header too large", err)
	}
}

func TestV184MuxClientPRNGLifecycle(t *testing.T) {
	client, peer := net.Pipe()
	defer peer.Close()
	pool := &sync.Pool{New: func() interface{} { b := make([]byte, 128*1024); return &b }}
	s := &MuxClientSession{
		wsConn: client,
		cfg: &Config{BufPool: pool},
		streams: make(map[uint32]*MuxStream),
		closed: make(chan struct{}),
		prng: maskPool.Get().(*maskPRNG),
	}

	drainDone := make(chan struct{})
	go func() {
		_, _ = io.Copy(io.Discard, peer)
		close(drainDone)
	}()

	var wg sync.WaitGroup
	payload := make([]byte, 1024)
	for i := 0; i < 16; i++ {
		wg.Add(1)
		go func(id int) {
			defer wg.Done()
			for j := 0; j < 100; j++ {
				if err := s.SendFrame(uint32(id+1), MuxCmdDATA, payload); err != nil {
					return
				}
			}
		}(i)
	}
	closeDone := make(chan struct{})
	go func() { s.Close(); close(closeDone) }()
	wg.Wait()
	select {
	case <-closeDone:
	case <-time.After(2 * time.Second):
		t.Fatal("MuxClientSession.Close did not complete")
	}
	_ = client.Close()
	select {
	case <-drainDone:
	case <-time.After(2 * time.Second):
		t.Fatal("pipe drain did not stop")
	}
	if s.prng != nil {
		t.Fatal("PRNG was not returned/cleared after session close")
	}
}

func TestV184MuxServerTargetLifecycle(t *testing.T) {
	st := newMuxServerStream(1, nil)
	defer st.Close()

	var wg sync.WaitGroup
	for i := 0; i < 64; i++ {
		wg.Add(1)
		go func() {
			defer wg.Done()
			c1, c2 := net.Pipe()
			_ = c2.Close()
			_ = st.setTargetConn(c1)
			_ = st.targetConnSnapshot()
			st.closeTargetConn()
		}()
	}
	wg.Add(1)
	go func() {
		defer wg.Done()
		st.Close()
	}()
	wg.Wait()
	if got := st.targetConnSnapshot(); got != nil {
		t.Fatal("targetConn still set after close")
	}
}

func TestV184SlowAndFastStreamsRemainIndependent(t *testing.T) {
	slow := newMuxServerStream(1, nil)
	fast := newMuxServerStream(2, nil)
	defer slow.Close()
	defer fast.Close()

	chunk := make([]byte, 64*1024)
	for i := 0; i < muxServerStreamBufferLimit/len(chunk); i++ {
		if !slow.PushData(chunk) {
			t.Fatalf("slow stream fill failed at %d", i)
		}
	}

	blocked := make(chan bool, 1)
	go func() { blocked <- slow.PushData(chunk) }()
	time.Sleep(20 * time.Millisecond)
	if !fast.PushData(chunk) {
		t.Fatal("fast stream was blocked by slow stream")
	}

	select {
	case frame := <-slow.writeChan:
		frame.release()
		slow.consumedBytes(len(chunk))
	case <-time.After(time.Second):
		t.Fatal("slow stream did not expose queued frame")
	}
	select {
	case ok := <-blocked:
		if !ok {
			t.Fatal("slow stream did not resume after capacity was freed")
		}
	case <-time.After(time.Second):
		t.Fatal("slow stream remained blocked after capacity was freed")
	}
}

func TestV184ConcurrentStreamCloseRSTEOF(t *testing.T) {
	st := newMuxStream(1, nil)
	var wg sync.WaitGroup
	for i := 0; i < 32; i++ {
		wg.Add(1)
		go func(i int) {
			defer wg.Done()
			if i%2 == 0 {
				st.PushEOF()
			} else {
				st.Reset()
			}
		}(i)
	}
	wg.Wait()
	st.Close()
}

func TestV184ThousandStreamCreateClose(t *testing.T) {
	streams := make([]*MuxServerStream, 1000)
	for i := range streams {
		streams[i] = newMuxServerStream(uint32(i+1), nil)
	}
	var wg sync.WaitGroup
	wg.Add(len(streams))
	for _, st := range streams {
		go func(s *MuxServerStream) {
			defer wg.Done()
			s.Close()
		}(st)
	}
	wg.Wait()
}

func TestV184ConcurrentLogRingSave(t *testing.T) {
	f, err := os.CreateTemp("", "goway-v184-log-*.log")
	if err != nil {
		t.Fatal(err)
	}
	path := f.Name()
	_ = f.Close()
	defer os.Remove(path)

	logRingMu.Lock()
	logFilePath = path
	logRingBuf = [10]string{}
	logRingPos = 0
	logRingLen = 0
	logRingMu.Unlock()

	var wg sync.WaitGroup
	for i := 0; i < 8; i++ {
		wg.Add(1)
		go func(id int) {
			defer wg.Done()
			for j := 0; j < 10; j++ {
				addLogFileEntry(fmt.Sprintf("worker=%d entry=%d", id, j))
			}
		}(i)
	}
	for i := 0; i < 8; i++ {
		wg.Add(1)
		go func() {
			defer wg.Done()
			for j := 0; j < 5; j++ {
				saveLogFile()
			}
		}()
	}
	wg.Wait()

	logRingMu.Lock()
	logFilePath = ""
	logRingMu.Unlock()
}
