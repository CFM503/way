name: v1.8.4 deep audit runner

on:
  push:
    branches: [v1.8.4-deep-audit]

permissions:
  contents: write

jobs:
  audit:
    if: "!contains(github.event.head_commit.message, 'Release v1.8.4: deep concurrency and lifecycle audit')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v1.8.4-deep-audit, fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache-dependency-path: goway/go.mod}
      - name: Patch source and run full verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('goway/goway.go'); s=p.read_text()
          def once(old,new,label):
              global s
              if s.count(old)!=1: raise SystemExit(f'{label}: expected 1 match, got {s.count(old)}')
              s=s.replace(old,new,1)
          once('Version        = "1.8.3"','Version        = "1.8.4"','version')
          once('''var (\n\tlogFilePath string\n\tlogRingBuf  [10]string\n\tlogRingPos  int\n\tlogRingLen  int\n)''','''var (\n\tlogFilePath string\n\tlogRingBuf  [10]string\n\tlogRingPos  int\n\tlogRingLen  int\n\tlogRingMu   sync.Mutex\n)''','log mutex')
          once('''func addLogFileEntry(entry string) {\n\tif logFilePath == "" {\n\t\treturn\n\t}\n\tts := time.Now().Format("2006-01-02 15:04:05")\n\tlogRingBuf[logRingPos] = ts + " " + entry\n\tlogRingPos = (logRingPos + 1) % len(logRingBuf)\n\tif logRingLen < len(logRingBuf) {\n\t\tlogRingLen++\n\t}\n\t// Write immediately so logs survive hard kills\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ {\n\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])\n\t}\n\tos.WriteFile(logFilePath, []byte(strings.Join(lines, "\\n")+"\\n"), 0644)\n}\n\nfunc saveLogFile() {\n\tif logFilePath == "" || logRingLen == 0 {\n\t\treturn\n\t}\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ {\n\t\tlines = append(lines, logRingBuf[(start+i)%len(logRingBuf)])\n\t}\n\tcontent := strings.Join(lines, "\\n") + "\\n"\n\tif err := os.WriteFile(logFilePath, []byte(content), 0644); err != nil {\n\t\tlog.Printf("Failed to save log file: %v", err)\n\t} else {\n\t\tlog.Printf("Log saved to %s (%d entries)", logFilePath, logRingLen)\n\t}\n}''','''func addLogFileEntry(entry string) {\n\tlogRingMu.Lock()\n\tdefer logRingMu.Unlock()\n\tif logFilePath == "" { return }\n\tts := time.Now().Format("2006-01-02 15:04:05")\n\tlogRingBuf[logRingPos] = ts + " " + entry\n\tlogRingPos = (logRingPos + 1) % len(logRingBuf)\n\tif logRingLen < len(logRingBuf) { logRingLen++ }\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ { lines = append(lines, logRingBuf[(start+i)%len(logRingBuf)]) }\n\t_ = os.WriteFile(logFilePath, []byte(strings.Join(lines, "\\n")+"\\n"), 0644)\n}\n\nfunc saveLogFile() {\n\tlogRingMu.Lock()\n\tdefer logRingMu.Unlock()\n\tif logFilePath == "" || logRingLen == 0 { return }\n\tvar lines []string\n\tstart := (logRingPos - logRingLen + len(logRingBuf)) % len(logRingBuf)\n\tfor i := 0; i < logRingLen; i++ { lines = append(lines, logRingBuf[(start+i)%len(logRingBuf)]) }\n\tcontent := strings.Join(lines, "\\n") + "\\n"\n\tif err := os.WriteFile(logFilePath, []byte(content), 0644); err != nil { log.Printf("Failed to save log file: %v", err) } else { log.Printf("Log saved to %s (%d entries)", logFilePath, logRingLen) }\n}''','log functions')
          once('''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\ttargetConn  net.Conn\n\tclosed      chan struct{}\n\tcloseOnce   sync.Once''','''type MuxServerStream struct {\n\tid          uint32\n\tsession     *MuxServerSession\n\twriteChan   chan muxDataFrame\n\ttargetMu    sync.Mutex\n\ttargetConn  net.Conn\n\tclosed      chan struct{}\n\tcloseOnce   sync.Once''','target field')
          once('''func (s *MuxServerStream) Close() {\n\ts.closeOnce.Do(func() {\n\t\tclose(s.closed)\n\t\tif s.targetConn != nil {\n\t\t\ts.targetConn.Close()\n\t\t}\n\t\ts.bufMu.Lock()''','''func (s *MuxServerStream) setTargetConn(conn net.Conn) bool {\n\ts.targetMu.Lock()\n\tdefer s.targetMu.Unlock()\n\tselect { case <-s.closed: if conn != nil { _ = conn.Close() }; return false; default: }\n\tif s.targetConn != nil { _ = s.targetConn.Close() }\n\ts.targetConn = conn\n\treturn true\n}\n\nfunc (s *MuxServerStream) closeTargetConn() {\n\ts.targetMu.Lock()\n\tdefer s.targetMu.Unlock()\n\tif s.targetConn != nil { _ = s.targetConn.Close(); s.targetConn = nil }\n}\n\nfunc (s *MuxServerStream) targetConnSnapshot() net.Conn {\n\ts.targetMu.Lock(); defer s.targetMu.Unlock(); return s.targetConn\n}\n\nfunc (s *MuxServerStream) Close() {\n\ts.closeOnce.Do(func() {\n\t\tclose(s.closed)\n\t\ts.closeTargetConn()\n\t\ts.bufMu.Lock()''','target lifecycle')
          once('''\toptimizeSocket(targetConn, s.cfg)\n\tst.targetConn = targetConn\n\n\tif len(initialData) > 0 {''','''\toptimizeSocket(targetConn, s.cfg)\n\tif !st.setTargetConn(targetConn) { return }\n\n\tif len(initialData) > 0 {''','target assignment')
          once('''func readUntilCRLFCRLF(br *bufio.Reader) ([]byte, error) {\n\tvar buf bytes.Buffer\n\tbuf.Grow(MaxHeaderSize)\n\tfor {\n\t\tline, err := br.ReadSlice('\\n')\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tbuf.Write(line)\n\t\tb := buf.Bytes()\n\t\tn := len(b)\n\t\tif n >= 4 &&\n\t\t\tb[n-4] == '\\r' && b[n-3] == '\\n' &&\n\t\t\tb[n-2] == '\\r' && b[n-1] == '\\n' {\n\t\t\treturn b, nil\n\t\t}\n\t\tif n > MaxHeaderSize {\n\t\t\treturn nil, errors.New("header too large")\n\t\t}\n\t}\n}''','''func readUntilCRLFCRLF(br *bufio.Reader) ([]byte, error) {\n\tvar buf bytes.Buffer\n\tbuf.Grow(MaxHeaderSize)\n\tfor {\n\t\tline, err := br.ReadSlice('\\n')\n\t\tif err == bufio.ErrBufferFull { return nil, errors.New("header too large") }\n\t\tif err != nil { return nil, err }\n\t\tif len(line) > MaxHeaderSize-buf.Len() { return nil, errors.New("header too large") }\n\t\tbuf.Write(line)\n\t\tb := buf.Bytes(); n := len(b)\n\t\tif n >= 4 && b[n-4] == '\\r' && b[n-3] == '\\n' && b[n-2] == '\\r' && b[n-1] == '\\n' { return b, nil }\n\t\tif n >= MaxHeaderSize { return nil, errors.New("header too large") }\n\t}\n}''','header limit')
          start=s.index('func (s *MuxClientSession) SendFrame'); end=s.index('func (s *MuxClientSession) readLoop',start); part=s[start:end]
          marker='''\ts.writeMu.Lock()\n\tdefer s.writeMu.Unlock()\n\n\tframeLen := MuxHeaderLen + payloadLen'''
          repl='''\ts.writeMu.Lock()\n\tdefer s.writeMu.Unlock()\n\tselect { case <-s.closed: return errors.New("mux session closed"); default: }\n\tprng := s.prng\n\tif prng == nil { return errors.New("mux session mask generator unavailable") }\n\n\tframeLen := MuxHeaderLen + payloadLen'''
          if part.count(marker)!=1: raise SystemExit('client SendFrame marker mismatch')
          part=part.replace(marker,repl,1).replace('writeWSFramePreallocatedFast(s.wsConn, buf, frameStart, frameLen, 0x2, s.prng)','writeWSFramePreallocatedFast(s.wsConn, buf, frameStart, frameLen, 0x2, prng)',1)
          s=s[:start]+part+s[end:]
          old='''\t\tfor _, st := range activeStreams {\n\t\t\tst.Reset()\n\t\t}\n\n\t\tif s.prng != nil {\n\t\t\tmaskPool.Put(s.prng)\n\t\t\ts.prng = nil\n\t\t}\n\t})\n}'''
          new='''\t\tfor _, st := range activeStreams { st.Reset() }\n\n\t\ts.writeMu.Lock()\n\t\tif s.prng != nil { maskPool.Put(s.prng); s.prng = nil }\n\t\ts.writeMu.Unlock()\n\t})\n}'''
          once(old,new,'client close')
          p.write_text(s)
          PY

          cat > goway/goway_v184_test.go <<'EOF'
          package main
          import ("bufio"; "fmt"; "io"; "net"; "os"; "strings"; "sync"; "testing"; "time")
          type v184Session struct{}
          func (*v184Session) SendFrame(uint32, byte, []byte) error { return nil }
          func (*v184Session) RemoveStream(uint32) {}
          func TestV184HeaderHardLimit(t *testing.T) {
              valid:=strings.Repeat("a",MaxHeaderSize-4)+"\r\n\r\n"; got,err:=readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(valid),MaxHeaderSize)); if err!=nil||len(got)!=MaxHeaderSize {t.Fatalf("valid max header: %d %v",len(got),err)}
              for _,in:=range []string{strings.Repeat("a",MaxHeaderSize+1)+"\r\n\r\n", strings.Repeat("a",MaxHeaderSize-5)+"\r\n"+"b\r\n\r\n"} {_,err=readUntilCRLFCRLF(bufio.NewReaderSize(strings.NewReader(in),MaxHeaderSize)); if err==nil||err.Error()!="header too large" {t.Fatalf("oversize err=%v",err)}}
          }
          func TestV184MuxClientPRNGLifecycle(t *testing.T) {
              c,p:=net.Pipe(); defer p.Close(); pool:=&sync.Pool{New:func()interface{}{b:=make([]byte,128*1024);return &b}}; s:=&MuxClientSession{wsConn:c,cfg:&Config{BufPool:pool},streams:map[uint32]*MuxStream{},closed:make(chan struct{}),prng:maskPool.Get().(*maskPRNG)}; drained:=make(chan struct{}); go func(){_,_=io.Copy(io.Discard,p);close(drained)}(); var wg sync.WaitGroup; payload:=make([]byte,1024); for i:=0;i<16;i++{wg.Add(1);go func(id int){defer wg.Done();for j:=0;j<100;j++{if s.SendFrame(uint32(id),MuxCmdDATA,payload)!=nil{return}}}(i)}; done:=make(chan struct{});go func(){s.Close();close(done)}();wg.Wait();select{case<-done:case<-time.After(2*time.Second):t.Fatal("Close hung")};_ = c.Close();select{case<-drained:case<-time.After(2*time.Second):t.Fatal("drain hung")};if s.prng!=nil{t.Fatal("prng not cleared")}
          }
          func TestV184MuxServerTargetLifecycle(t *testing.T){st:=newMuxServerStream(1,nil);defer st.Close();var wg sync.WaitGroup;for i:=0;i<64;i++{wg.Add(1);go func(){defer wg.Done();a,b:=net.Pipe();_=b.Close();_=st.setTargetConn(a);_=st.targetConnSnapshot();st.closeTargetConn()}()};wg.Add(1);go func(){defer wg.Done();st.Close()}();wg.Wait();if st.targetConnSnapshot()!=nil{t.Fatal("target retained")}}
          func TestV184SlowFastAndRST(t *testing.T){slow:=newMuxServerStream(1,nil);fast:=newMuxServerStream(2,nil);defer slow.Close();defer fast.Close();chunk:=make([]byte,64*1024);for i:=0;i<muxServerStreamBufferLimit/len(chunk);i++{if !slow.PushData(chunk){t.Fatal("fill")}};blocked:=make(chan bool,1);go func(){blocked<-slow.PushData(chunk)}();time.Sleep(20*time.Millisecond);if !fast.PushData(chunk){t.Fatal("fast blocked")};f:=<-slow.writeChan;f.release();slow.consumedBytes(len(chunk));select{case ok:=<-blocked:if !ok{t.Fatal("slow did not resume")};case<-time.After(time.Second):t.Fatal("slow stuck")};st:=newMuxStream(3,&v184Session{});done:=make(chan struct{});go func(){_ = st.PushDataFrame(muxDataFrame{data:chunk});close(done)}();st.Reset();select{case<-done:case<-time.After(time.Second):t.Fatal("RST did not unblock")}}
          func TestV184ThousandStreams(t *testing.T){ss:=make([]*MuxServerStream,1000);for i:=range ss{ss[i]=newMuxServerStream(uint32(i+1),nil)};var wg sync.WaitGroup;wg.Add(len(ss));for _,st:=range ss{go func(s *MuxServerStream){defer wg.Done();s.Close()}(st)};wg.Wait()}
          func TestV184ConcurrentLogRingSave(t *testing.T){f,e:=os.CreateTemp("","goway-v184-*.log");if e!=nil{t.Fatal(e)};path:=f.Name();_ = f.Close();defer os.Remove(path);logRingMu.Lock();logFilePath=path;logRingBuf=[10]string{};logRingPos=0;logRingLen=0;logRingMu.Unlock();var wg sync.WaitGroup;for i:=0;i<8;i++{wg.Add(1);go func(id int){defer wg.Done();for j:=0;j<10;j++{addLogFileEntry(fmt.Sprintf("%d/%d",id,j))}}(i)};for i:=0;i<8;i++{wg.Add(1);go func(){defer wg.Done();for j:=0;j<5;j++{saveLogFile()}}()};wg.Wait();logRingMu.Lock();logFilePath="";logRingMu.Unlock()}
          EOF

          cd goway
          gofmt -w goway.go goway_v184_test.go
          go test ./...
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../goway-windows-amd64-v184.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../goway-debian12-amd64-v184 .
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../goway-openwrt-arm7-v184 .
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md');s=p.read_text(encoding='utf-8-sig')
          if '## [v1.8.4]' not in s:
              section='''## [v1.8.4] - 2026-09-11\n\n### Goway 深度并发与生命周期审计\n\n- 修复 MuxClientSession PRNG 与 sync.Pool 的关闭生命周期竞争；SendFrame 在 writeMu 内重新检查状态并固定 PRNG，Close 等待物理写临界区退出后再归还。\n- 为 MuxServerStream.targetConn 增加独立 targetMu，保护设置、快照、关闭和清空，不进入数据转发热路径。\n- 强化 readUntilCRLFCRLF() 硬上限，超长单行和累计头部均立即返回 header too large。\n- 为日志 ring buffer 与保存路径增加并发保护。\n- 强化并发回归：慢/快流、RST/EOF、targetConn、1000 Stream、PRNG、日志。\n- 审计确认现有 writeMu 会串行化物理 WebSocket Write；本版本不强行引入高风险 bounded queue 重构，保持协议与架构兼容。\n\n'''
              p.write_text(s.replace('---\n','---\n\n'+section,1),encoding='utf-8-sig')
          PY
          rm -f .github/workflows/v184-audit-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go goway/goway_v184_test.go CHANGELOG.md .github/workflows/v184-audit-runner.yml
          git diff --cached --check
          git commit -m 'Release v1.8.4: deep concurrency and lifecycle audit'
          git push origin HEAD:v1.8.4-deep-audit
