name: tmp-v184-6min-stress

on:
  push:
    branches: [tmp-v184-6min-stress]

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - name: 6 minute race stress
        working-directory: goway
        run: |
          set -euo pipefail
          go test -race ./... -count=1 -timeout=7m &
          pid=$!
          start=$SECONDS
          while kill -0 "$pid" 2>/dev/null; do
            elapsed=$((SECONDS-start))
            if [ "$elapsed" -ge 360 ]; then
              echo "6-minute stress window reached; stopping test process"
              kill -INT "$pid" 2>/dev/null || true
              sleep 5
              kill -TERM "$pid" 2>/dev/null || true
              wait "$pid" || true
              echo "STRESS_WINDOW_SECONDS=360"
              exit 0
            fi
            sleep 1
          done
          wait "$pid"
          echo "STRESS_WINDOW_SECONDS=$((SECONDS-start))"
