name: tmp-v184-6min-stress

on:
  push:
    branches: [tmp-v184-6min-stress]

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: 5-round race stress
        working-directory: goway
        run: |
          set -euo pipefail
          start=$SECONDS
          go test -race ./... -count=5 -timeout=9m
          elapsed=$((SECONDS-start))
          echo "STRESS_ROUNDS=5"
          echo "STRESS_WINDOW_SECONDS=$elapsed"
