name: Pre-release validation copy2

on:
  push:
    paths:
      - '.github/workflows/pre-release-validation-copy2.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod
      - working-directory: goway
        run: |
          set -euo pipefail
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/goway-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/goway-linux-amd64 .
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/goway-openwrt-arm7 .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod
      - working-directory: goway
        run: go build -trimpath -o goway.exe .
      - working-directory: goway
        shell: pwsh
        run: go test ./... -count=1 -run 'Test(EndToEndSubprocessIntegration|ViolentStressSimulation)$' -timeout 15m
