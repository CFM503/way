name: Repair GoWay MUX

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch MUX isolation, EOF handling and buffer cap
        shell: python
        run: |
          from pathlib import Path
          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')

          old = '''func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tselect {
\tcase <-s.closed:
\t\ts.bufMu.Unlock()
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxClientStreamBufferLimit {
\t\ts.bufMu.Unlock()
\t\tlogWarn("[MUX] Stream %d receive buffer limit reached, resetting stream", s.id)
\t\ts.Reset()
\t\treturn false
\t}
\tselect {
\tcase s.readChan <- frame:
\t\ts.queuedBytes += dataLen
\t\ts.bufMu.Unlock()
\t\treturn true
\tdefault:
\t\ts.bufMu.Unlock()
\t\tlogWarn("[MUX] Stream %d receive queue full, resetting stream", s.id)
\t\ts.Reset()
\t\treturn false
\t}
}
'''
          new = '''func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxClientStreamBufferLimit {
\t\treturn false
\t}
\tselect {
\tcase s.readChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.NewTimer(3 * time.Second)
\tdefer deadline.Stop()
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.readChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\tcase <-deadline.C:
\t\t\tlogWarn("[MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
\t\t\ts.Reset()
\t\t\treturn false
\t\t}
\t}
}
'''
          if s.count(old) != 1:
              raise SystemExit('client PushDataFrame marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''func (s *MuxStream) PushEOF() {
\ts.readClosed.Store(true)
\tselect {
\tcase <-s.closed:
\tdefault:
\t\tselect {
\t\tcase s.readChan <- muxDataFrame{data: nil}:
\t\tdefault:
\t\t}
\t}
}
'''
          new = '''func (s *MuxStream) PushEOF() {
\ts.readClosed.Store(true)
\tselect {
\tcase s.hasSpace <- struct{}{}:
\tdefault:
\t}
}
'''
          if s.count(old) != 1:
              raise SystemExit('client PushEOF marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tselect {
\tcase <-s.closed:
\t\ts.bufMu.Unlock()
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxServerStreamBufferLimit {
\t\ts.bufMu.Unlock()
\t\tlogWarn("[SERVER-MUX] Stream %d receive buffer limit reached, resetting stream", s.id)
\t\ts.Close()
\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
\t\treturn false
\t}
\tselect {
\tcase s.writeChan <- frame:
\t\ts.queuedBytes += dataLen
\t\ts.bufMu.Unlock()
\t\treturn true
\tdefault:
\t\ts.bufMu.Unlock()
\t\tlogWarn("[SERVER-MUX] Stream %d receive queue full, resetting stream", s.id)
\t\ts.Close()
\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
\t\treturn false
\t}
}
'''
          new = '''func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxServerStreamBufferLimit {
\t\treturn false
\t}
\tselect {
\tcase s.writeChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.NewTimer(3 * time.Second)
\tdefer deadline.Stop()
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.writeChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\tcase <-deadline.C:
\t\t\tlogWarn("[SERVER-MUX] Stream %d receive backpressure timeout, resetting stream", s.id)
\t\t\ts.Close()
\t\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
\t\t\treturn false
\t\t}
\t}
}
'''
          if s.count(old) != 1:
              raise SystemExit('server PushDataFrame marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''type MuxServerStream struct {
\tid          uint32
\tsession     *MuxServerSession
\twriteChan   chan muxDataFrame
\ttargetConn  net.Conn
\tclosed      chan struct{}
\tcloseOnce   sync.Once
\tbufMu       sync.Mutex
\tqueuedBytes int64
\thasSpace    chan struct{}
}
'''
          new = '''type MuxServerStream struct {
\tid          uint32
\tsession     *MuxServerSession
\twriteChan   chan muxDataFrame
\tfin         chan struct{}
\tfinOnce     sync.Once
\ttargetConn  net.Conn
\tclosed      chan struct{}
\tcloseOnce   sync.Once
\tbufMu       sync.Mutex
\tqueuedBytes int64
\thasSpace    chan struct{}
}
'''
          if s.count(old) != 1:
              raise SystemExit('server stream struct marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''\treturn &MuxServerStream{
\t\tid:        id,
\t\tsession:   session,
\t\twriteChan: make(chan muxDataFrame, 256),
\t\tclosed:    make(chan struct{}),
\t\thasSpace:  make(chan struct{}, 1),
\t}
'''
          new = '''\treturn &MuxServerStream{
\t\tid:        id,
\t\tsession:   session,
\t\twriteChan: make(chan muxDataFrame, 256),
\t\tfin:       make(chan struct{}),
\t\tclosed:    make(chan struct{}),
\t\thasSpace:  make(chan struct{}, 1),
\t}
'''
          if s.count(old) != 1:
              raise SystemExit('server stream constructor marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''func (s *MuxServerStream) consumedBytes(n int) {
\tif n <= 0 {
\t\treturn
\t}
\ts.bufMu.Lock()
\ts.queuedBytes -= int64(n)
\tif s.queuedBytes < 0 {
\t\ts.queuedBytes = 0
\t}
\tif s.queuedBytes < muxServerStreamBufferLimit {
\t\tselect {
\t\tcase s.hasSpace <- struct{}{}:
\t\tdefault:
\t\t}
\t}
\ts.bufMu.Unlock()
}
'''
          new = '''func (s *MuxServerStream) consumedBytes(n int) {
\tif n <= 0 {
\t\treturn
\t}
\ts.bufMu.Lock()
\ts.queuedBytes -= int64(n)
\tif s.queuedBytes < 0 {
\t\ts.queuedBytes = 0
\t}
\tif s.queuedBytes < muxServerStreamBufferLimit {
\t\tselect {
\t\tcase s.hasSpace <- struct{}{}:
\t\tdefault:
\t\t}
\t}
\ts.bufMu.Unlock()
}

func (s *MuxServerStream) PushEOF() {
\ts.finOnce.Do(func() { close(s.fin) })
\tselect {
\tcase s.hasSpace <- struct{}{}:
\tdefault:
\t}
}
'''
          if s.count(old) != 1:
              raise SystemExit('server consumedBytes marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''\t\tcase MuxCmdDATA:
\t\t\ts.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok && len(payload) > 0 {
\t\t\t\tframe := muxDataFrame{
\t\t\t\t\tdata: payload,
\t\t\t\t\tbPtr: bPtr,
\t\t\t\t\tpool: cfg.BufPool,
\t\t\t\t}
\t\t\t\tbPtr = cfg.BufPool.Get().(*[]byte)
\t\t\t\tbuf = *bPtr
\t\t\t\tif !st.PushDataFrame(frame) {
\t\t\t\t\tframe.release()
\t\t\t\t\tsession.streamsMu.Lock()
\t\t\t\t\tdelete(session.streams, streamID)
\t\t\t\t\tsession.streamsMu.Unlock()
\t\t\t\t}
\t\t\t}

\t\tcase MuxCmdFIN:
\t\t\tsession.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok {
\t\t\t\tif !st.PushDataFrame(muxDataFrame{data: nil}) {
\t\t\t\t\tsession.streamsMu.Lock()
\t\t\t\t\tdelete(session.streams, streamID)
\t\t\t\t\tsession.streamsMu.Unlock()
\t\t\t\t}
\t\t\t}
'''
          new = '''\t\tcase MuxCmdDATA:
\t\t\tsession.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok && len(payload) > 0 {
\t\t\t\tframe := muxDataFrame{
\t\t\t\t\tdata: payload,
\t\t\t\t\tbPtr: bPtr,
\t\t\t\t\tpool: cfg.BufPool,
\t\t\t\t}
\t\t\t\tbPtr = cfg.BufPool.Get().(*[]byte)
\t\t\t\tbuf = *bPtr
\t\t\t\tif !st.enqueueDataFrame(frame) {
\t\t\t\t\tframe.release()
\t\t\t\t\tst.Close()
\t\t\t\t\t_ = st.session.SendFrame(st.id, MuxCmdRST, nil)
\t\t\t\t}
\t\t\t}

\t\tcase MuxCmdFIN:
\t\t\tsession.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok {
\t\t\t\tst.PushEOF()
\t\t\t}
'''
          if s.count(old) != 1:
              raise SystemExit('server readLoop mux marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''\t\tcase MuxCmdDATA:
\t\t\tif len(payload) > 0 {
\t\t\t\tframe := muxDataFrame{
\t\t\t\t\tdata: payload,
\t\t\t\t\tbPtr: bPtr,
\t\t\t\t\tpool: s.cfg.BufPool,
\t\t\t\t}
\t\t\t\tbPtr = s.cfg.BufPool.Get().(*[]byte)
\t\t\t\tbuf = *bPtr
\t\t\t\tif !st.PushDataFrame(frame) {
\t\t\t\t\tframe.release()
\t\t\t\t}
\t\t\t\tstats.AddBytes(0, int64(len(payload)))
\t\t\t}
'''
          new = '''\t\tcase MuxCmdDATA:
\t\t\tif len(payload) > 0 {
\t\t\t\tframe := muxDataFrame{
\t\t\t\t\tdata: payload,
\t\t\t\t\tbPtr: bPtr,
\t\t\t\t\tpool: s.cfg.BufPool,
\t\t\t\t}
\t\t\t\tbPtr = s.cfg.BufPool.Get().(*[]byte)
\t\t\t\tbuf = *bPtr
\t\t\t\tif !st.enqueueDataFrame(frame) {
\t\t\t\t\tframe.release()
\t\t\t\t\tst.Reset()
\t\t\t\t}
\t\t\t\tstats.AddBytes(0, int64(len(payload)))
\t\t\t}
'''
          if s.count(old) != 1:
              raise SystemExit('client readLoop mux marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''\t\tcase MuxCmdFIN:
\t\t\tst.PushEOF()
'''
          if s.count(old) != 1:
              raise SystemExit('client readLoop FIN marker not found exactly once')

          old = '''\t\tfor {
\t\t\tselect {
\t\t\tcase <-st.closed:
\t\t\t\treturn
\t\t\tcase frame, ok := <-st.writeChan:
\t\t\t\tif !ok || frame.data == nil {
\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok {
\t\t\t\t\t\ttc.CloseWrite()
\t\t\t\t\t}
\t\t\t\t\treturn
\t\t\t\t}
\t\t\t\tdata := frame.data
\t\t\t\t_, err := targetConn.Write(data)
\t\t\t\tst.consumedBytes(len(data))
\t\t\t\tframe.release()
\t\t\t\tif err != nil {
\t\t\t\t\tst.Close()
\t\t\t\t\treturn
\t\t\t\t}
\t\t\t\tstats.AddBytes(int64(len(data)), 0)
\t\t\t}
\t\t}
'''
          new = '''\t\tfor {
\t\t\tselect {
\t\t\tcase <-st.closed:
\t\t\t\treturn
\t\t\tdefault:
\t\t\t}

\t\t\tselect {
\t\t\tcase frame := <-st.writeChan:
\t\t\t\tif frame.data == nil {
\t\t\t\t\tframe.release()
\t\t\t\t\tcontinue
\t\t\t\t}
\t\t\t\tdata := frame.data
\t\t\t\t_, err := targetConn.Write(data)
\t\t\t\tst.consumedBytes(len(data))
\t\t\t\tframe.release()
\t\t\t\tif err != nil {
\t\t\t\t\tst.Close()
\t\t\t\t\treturn
\t\t\t\t}
\t\t\t\tstats.AddBytes(int64(len(data)), 0)
\t\t\tdefault:
\t\t\t\tselect {
\t\t\t\tcase <-st.closed:
\t\t\t\t\treturn
\t\t\t\tcase <-st.fin:
\t\t\t\t\tfor {
\t\t\t\t\t\tselect {
\t\t\t\t\t\tcase frame := <-st.writeChan:
\t\t\t\t\t\t\tif frame.data != nil {
\t\t\t\t\t\t\t\t_, _ = targetConn.Write(frame.data)
\t\t\t\t\t\t\t\tst.consumedBytes(len(frame.data))
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\tframe.release()
\t\t\t\t\t\tdefault:
\t\t\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok {
\t\t\t\t\t\t\t\t_ = tc.CloseWrite()
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\treturn
\t\t\t\t\t\t}
\t\t\t\t\t}
\t\t\t\t}
\t\t\t}
\t\t}
'''
          if s.count(old) != 1:
              raise SystemExit('server stream writer marker not found exactly once')
          s = s.replace(old, new, 1)

          old = '''\tif bufSize > 12*1024*1024+14+MuxHeaderLen {
\t\tbufSize = 256*1024 + 14 + MuxHeaderLen
\t}
'''
          new = '''\tif bufSize > 12*1024*1024+14+MuxHeaderLen {
\t\tbufSize = 12*1024*1024 + 14 + MuxHeaderLen
\t}
'''
          if s.count(old) != 1:
              raise SystemExit('buffer cap marker not found exactly once')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Format and run MUX tests
        run: |
          set -euo pipefail
          gofmt -w goway/goway.go
          cd goway
          go test ./... -run 'TestMux' -count=1
          go test ./... -run '^$'
          go vet ./...

      - name: Commit and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goway/goway.go
          git rm -f .github/workflows/repair-goway-mux.yml
          git commit -m "fix: isolate mux backpressure and preserve stream half-close [skip ci]"
          git push
