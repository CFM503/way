name: Repair GoWay all

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: goway/go.mod

      - name: Repair source
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('goway/goway.go')
          s = p.read_text(encoding='utf-8')

          # ---- deadIPs: consistent 5-minute cooldown map ----
          s = s.replace(
              '\tdeadIPs     map[string]bool // IPs that failed during session (permanent until exit)',
              '\tdeadIPs     map[string]time.Time // temporarily suppress failed IPs', 1)
          s = s.replace('\tdeadIPs:     make(map[string]bool),', '\tdeadIPs:     make(map[string]time.Time),', 1)
          s = s.replace('\tdeadIPs:     make(map[string]time.Time),', '\tdeadIPs:     make(map[string]time.Time),', 1)
          s = s.replace('connPool.deadIPs[cfg.UpstreamHost] = true', 'connPool.deadIPs[cfg.UpstreamHost] = time.Now().Add(5 * time.Minute)', 1)
          old = '''\t// Skip known-dead IPs (permanent for session)\n\tp.mu.Lock()\n\tif p.deadIPs[dialHost] {\n\t\tp.mu.Unlock()\n\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)\n\t}\n\tp.mu.Unlock()'''
          new = '''\t// Skip recently failed IPs, but allow retry after cooldown.\n\tp.mu.Lock()\n\tif until, ok := p.deadIPs[dialHost]; ok {\n\t\tif time.Now().Before(until) {\n\t\t\tp.mu.Unlock()\n\t\t\treturn p.tryFallbackDial(dialer, wsHost, wsPort, sniHostname)\n\t\t}\n\t\tdelete(p.deadIPs, dialHost)\n\t}\n\tp.mu.Unlock()'''
          if s.count(old) == 1:
              s = s.replace(old, new, 1)
          old = '''\t\t// Mark IP as dead for session\n\t\tp.mu.Lock()\n\t\tp.deadIPs[dialHost] = true\n\t\tp.mu.Unlock()'''
          new = '''\t\t// Temporarily suppress this IP; retry it after cooldown.\n\t\tp.mu.Lock()\n\t\tp.deadIPs[dialHost] = time.Now().Add(5 * time.Minute)\n\t\tp.mu.Unlock()'''
          if s.count(old) == 1:
              s = s.replace(old, new, 1)

          # Ensure no bool assignments remain in this map.
          s = s.replace('deadIPs[dialHost] = true', 'deadIPs[dialHost] = time.Now().Add(5 * time.Minute)')

          # ---- Client MUX stream ----
          client_pat = re.compile(r'func \(s \*MuxStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxStream\) PushData\(', re.S)
          client_repl = '''func (s *MuxStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxClientStreamBufferLimit {
\t\treturn false
\t}
\tselect {
\tcase s.readChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxClientStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.readChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 {
\t\t\ts.Reset()
\t\t\treturn false
\t\t}
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait { wait = remaining }
\t\ttimer := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed:
\t\t\tif !timer.Stop() { <-timer.C }
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\t\tif !timer.Stop() { <-timer.C }
\t\tcase <-timer.C:
\t\t}
\t}
}

func (s *MuxStream) PushData('''
          s, n = client_pat.subn(client_repl, s, count=1)
          if n != 1:
              raise SystemExit('client PushDataFrame replacement failed')
          s = s.replace('''func (s *MuxStream) PushEOF() {
\ts.readClosed.Store(true)
\tselect {
\tcase <-s.closed:
\tdefault:
\t\tselect {
\t\tcase s.readChan <- muxDataFrame{data: nil}:
\t\tdefault:
\t\t}
\t}
}''', '''func (s *MuxStream) PushEOF() {
\tif s.readClosed.Swap(true) { return }
\tselect {
\tcase <-s.closed:
\t\treturn
\tdefault:
\t}
\tselect { case s.hasSpace <- struct{}{}: default: }
}''', 1)

          # ---- Server MUX stream ----
          server_pat = re.compile(r'func \(s \*MuxServerStream\) PushDataFrame\(frame muxDataFrame\) bool \{.*?\n\}\n\nfunc \(s \*MuxServerStream\) PushData\(', re.S)
          server_repl = '''func (s *MuxServerStream) enqueueDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\tselect {
\tcase <-s.closed:
\t\treturn false
\tcase <-s.fin:
\t\treturn false
\tdefault:
\t}
\tif s.queuedBytes+dataLen > muxServerStreamBufferLimit { return false }
\tselect {
\tcase s.writeChan <- frame:
\t\ts.queuedBytes += dataLen
\t\treturn true
\tdefault:
\t\treturn false
\t}
}

func (s *MuxServerStream) PushDataFrame(frame muxDataFrame) bool {
\tdataLen := int64(len(frame.data))
\tdeadline := time.Now().Add(3 * time.Second)
\tfor {
\t\ts.bufMu.Lock()
\t\tselect {
\t\tcase <-s.closed:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tcase <-s.fin:
\t\t\ts.bufMu.Unlock()
\t\t\treturn false
\t\tdefault:
\t\t}
\t\tif s.queuedBytes+dataLen <= muxServerStreamBufferLimit {
\t\t\tselect {
\t\t\tcase s.writeChan <- frame:
\t\t\t\ts.queuedBytes += dataLen
\t\t\t\ts.bufMu.Unlock()
\t\t\t\treturn true
\t\t\tdefault:
\t\t\t}
\t\t}
\t\ts.bufMu.Unlock()
\t\tremaining := time.Until(deadline)
\t\tif remaining <= 0 {
\t\t\ts.Close()
\t\t\t_ = s.session.SendFrame(s.id, MuxCmdRST, nil)
\t\t\treturn false
\t\t}
\t\twait := 100 * time.Millisecond
\t\tif remaining < wait { wait = remaining }
\t\ttimer := time.NewTimer(wait)
\t\tselect {
\t\tcase <-s.closed:
\t\t\tif !timer.Stop() { <-timer.C }
\t\t\treturn false
\t\tcase <-s.fin:
\t\t\tif !timer.Stop() { <-timer.C }
\t\t\treturn false
\t\tcase <-s.hasSpace:
\t\t\tif !timer.Stop() { <-timer.C }
\t\tcase <-timer.C:
\t\t}
\t}
}

func (s *MuxServerStream) PushData('''
          s, n = server_pat.subn(server_repl, s, count=1)
          if n != 1:
              raise SystemExit('server PushDataFrame replacement failed')

          s = s.replace('''type MuxServerStream struct {
\tid          uint32
\tsession     *MuxServerSession
\twriteChan   chan muxDataFrame
\ttargetConn  net.Conn''', '''type MuxServerStream struct {
\tid          uint32
\tsession     *MuxServerSession
\twriteChan   chan muxDataFrame
\tfin         chan struct{}
\tfinOnce     sync.Once
\ttargetConn  net.Conn''', 1)
          s = s.replace('''\treturn &MuxServerStream{
\t\tid:        id,
\t\tsession:   session,
\t\twriteChan: make(chan muxDataFrame, 256),
\t\tclosed:    make(chan struct{}),''', '''\treturn &MuxServerStream{
\t\tid:        id,
\t\tsession:   session,
\t\twriteChan: make(chan muxDataFrame, 256),
\t\tfin:       make(chan struct{}),
\t\tclosed:    make(chan struct{}),''', 1)
          marker = '''func (s *MuxServerStream) QueuedBytes() int64 {
\ts.bufMu.Lock()
\tdefer s.bufMu.Unlock()
\treturn s.queuedBytes
}
'''
          if marker in s and 'func (s *MuxServerStream) PushEOF()' not in s:
              s = s.replace(marker, marker + '''
func (s *MuxServerStream) PushEOF() {
\ts.finOnce.Do(func() { close(s.fin) })
\tselect { case s.hasSpace <- struct{}{}: default: }
}
''', 1)

          # Session read loops: never block on a single stream.
          old = 'if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()'
          if s.count(old) >= 1:
              s = s.replace(old, 'if !st.enqueueDataFrame(frame) {\n\t\t\t\t\tframe.release()', 1)
          old = 'if !st.PushDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tsession.streamsMu.Lock()'
          if s.count(old) == 1:
              s = s.replace(old, 'if !st.enqueueDataFrame(frame) {\n\t\t\t\t\tframe.release()\n\t\t\t\t\tst.Close()\n\t\t\t\t\t_ = st.session.SendFrame(st.id, MuxCmdRST, nil)', 1)

          old_fin = '''\t\tcase MuxCmdFIN:
\t\t\tsession.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok {
\t\t\t\tif !st.PushDataFrame(muxDataFrame{data: nil}) {
\t\t\t\t\tsession.streamsMu.Lock()
\t\t\t\t\tdelete(session.streams, streamID)
\t\t\t\t\tsession.streamsMu.Unlock()
\t\t\t\t}
\t\t\t}'''
          new_fin = '''\t\tcase MuxCmdFIN:
\t\t\tsession.streamsMu.RLock()
\t\t\tst, ok := session.streams[streamID]
\t\t\tsession.streamsMu.RUnlock()
\t\t\tif ok { st.PushEOF() }'''
          if s.count(old_fin) == 1:
              s = s.replace(old_fin, new_fin, 1)

          # Server writer: preserve queued DATA, then half-close target.
          writer_old = '''\tgo func() {
\t\tfor {
\t\t\tselect {
\t\t\tcase <-st.closed:
\t\t\t\treturn
\t\t\tcase frame, ok := <-st.writeChan:
\t\t\t\tif !ok || frame.data == nil {
\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok {
\t\t\t\t\t\ttc.CloseWrite()
\t\t\t\t\t}
\t\t\t\t\treturn
\t\t\t\t}
\t\t\t\tdata := frame.data
\t\t\t\t_, err := targetConn.Write(data)
\t\t\t\tst.consumedBytes(len(data))
\t\t\t\tframe.release()
\t\t\t\tif err != nil {
\t\t\t\t\tst.Close()
\t\t\t\t\treturn
\t\t\t\t}
\t\t\t\tstats.AddBytes(int64(len(data)), 0)
\t\t\t}
\t\t}
\t}()'''
          writer_new = '''\twriteDone := make(chan struct{})
\tgo func() {
\t\tdefer close(writeDone)
\t\tfor {
\t\t\tselect {
\t\t\tcase <-st.closed:
\t\t\t\treturn
\t\t\tcase frame := <-st.writeChan:
\t\t\t\tif frame.data == nil { frame.release(); continue }
\t\t\t\tdata := frame.data
\t\t\t\t_, err := targetConn.Write(data)
\t\t\t\tst.consumedBytes(len(data))
\t\t\t\tframe.release()
\t\t\t\tif err != nil { st.Close(); return }
\t\t\t\tstats.AddBytes(int64(len(data)), 0)
\t\t\tcase <-st.fin:
\t\t\t\tfor {
\t\t\t\t\tselect {
\t\t\t\t\tcase frame := <-st.writeChan:
\t\t\t\t\t\tif frame.data != nil { _, _ = targetConn.Write(frame.data); st.consumedBytes(len(frame.data)) }
\t\t\t\t\t\tframe.release()
\t\t\t\t\tdefault:
\t\t\t\t\t\tif tc, ok := targetConn.(*net.TCPConn); ok { _ = tc.CloseWrite() }
\t\t\t\t\t\treturn
\t\t\t\t\t}
\t\t\t\t}
\t\t\t}
\t\t}
\t}()'''
          if s.count(writer_old) == 1:
              s = s.replace(writer_old, writer_new, 1)

          eof_old = '''\t\tif errRead != nil {
\t\t\tif errRead == io.EOF {
\t\t\t\ts.SendFrame(st.id, MuxCmdFIN, nil)
\t\t\t} else {
\t\t\t\ts.SendFrame(st.id, MuxCmdRST, nil)
\t\t\t}
\t\t\treturn
\t\t}'''
          eof_new = '''\t\tif errRead != nil {
\t\t\tif errRead == io.EOF {
\t\t\t\tif s.SendFrame(st.id, MuxCmdFIN, nil) == nil {
\t\t\t\t\tselect {
\t\t\t\t\tcase <-writeDone:
\t\t\t\t\tcase <-time.After(time.Duration(s.cfg.ConnTimeout) * time.Second):
\t\t\t\t\t}
\t\t\t\t}
\t\t\t} else { s.SendFrame(st.id, MuxCmdRST, nil) }
\t\t\treturn
\t\t}'''
          if s.count(eof_old) == 1:
              s = s.replace(eof_old, eof_new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate
        working-directory: goway
        run: |
          gofmt -w goway.go
          go test ./... -run 'TestMux|TestConnPool|TestBuffer' -count=1
          go test ./... -run '^$'
          go vet ./...

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden goway mux backpressure and half-close [skip ci]'
          git push
