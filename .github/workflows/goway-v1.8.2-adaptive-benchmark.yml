name: GoWay v1.8.2 Adaptive Benchmark

on:
  push:
    paths:
      - .github/workflows/trigger-v1.8.2

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build and benchmark
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd goway
          $base = '0ba97216b31006a8b10e9dfb9c2ed2fe034d2899'
          git show "${base}:goway/goway.go" | Set-Content baseline.go -NoNewline -Encoding utf8
          $adaptive = Get-Content baseline.go -Raw
          $adaptive = $adaptive.Replace('Version        = "1.8.1"','Version        = "1.8.2"')
          $old = @'
\t// If at least one session is active, select the least loaded (least active streams, with round-robin tie-breaking)
\tif len(p.sessions) > 0 {
\t\tsess := p.pickBestSessionLocked()
\t\tsess.activeStreams.Add(1)

\t\t// If pool capacity is not yet reached, trigger background dial to scale up
\t\tif !p.closed && len(p.sessions)+p.dialing < p.maxSess {
\t\t\tp.dialing++
\t\t\tgo p.dialBackgroundSession()
\t\t}

\t\tp.mu.Unlock()
\t\treturn sess, nil
\t}
'@
          $new = @'
\t// Keep a single-stream workload on one physical Mux session. Scale out only
\t// when currently available sessions are already occupied by active streams.
\tif len(p.sessions) > 0 {
\t\tactiveBefore := int64(0)
\t\tfor _, s := range p.sessions {
\t\t\tactiveBefore += s.ActiveStreams()
\t\t}
\t\tsess := p.pickBestSessionLocked()
\t\tsess.activeStreams.Add(1)
\t\tif !p.closed && activeBefore >= int64(len(p.sessions)) && len(p.sessions)+p.dialing < p.maxSess {
\t\t\tp.dialing++
\t\t\tgo p.dialBackgroundSession()
\t\t}
\t\tp.mu.Unlock()
\t\treturn sess, nil
\t}
'@
          if (-not $adaptive.Contains($old)) { throw 'adaptive patch target not found' }
          $adaptive = $adaptive.Replace($old,$new)
          Set-Content adaptive.go $adaptive -NoNewline -Encoding utf8
          gofmt -w baseline.go adaptive.go
          go build -trimpath -ldflags='-s -w' -o baseline.exe baseline.go
          go build -trimpath -ldflags='-s -w' -o adaptive.exe adaptive.go

          $root = Join-Path $env:RUNNER_TEMP 'goway-http'
          New-Item -ItemType Directory -Force $root | Out-Null
          $file = Join-Path $root payload.bin
          $fs = [IO.File]::Create($file); try {$fs.SetLength(512MB)} finally {$fs.Dispose()}
          $http = Start-Process python -ArgumentList @('-m','http.server','18000','--bind','127.0.0.1','--directory',$root) -PassThru
          try {
            Start-Sleep 2
            foreach($case in @(@('baseline','baseline.exe'),@('adaptive','adaptive.exe'))){
              $label=$case[0]; $exe=$case[1]
              $server=Start-Process ".\$exe" -ArgumentList @('-p','127.0.0.1:18880','-k','benchmark','-W','1024','-no-block-local','-log','ERROR') -PassThru
              $client=Start-Process ".\$exe" -ArgumentList @('-p','127.0.0.1:19080','-up','ws://127.0.0.1:18880','-k','benchmark','-W','1024','-no-block-local','-mux','-mux-sessions','4','-log','ERROR') -PassThru
              try {
                Start-Sleep 3
                if($server.HasExited -or $client.HasExited){throw "$label process exited"}
                $sw=[Diagnostics.Stopwatch]::StartNew()
                & curl.exe --fail --silent --show-error --socks5-hostname 127.0.0.1:19080 --output NUL http://127.0.0.1:18000/payload.bin
                $code=$LASTEXITCODE; $sw.Stop(); if($code -ne 0){throw "$label curl failed $code"}
                $mbps=(512MB/$sw.Elapsed.TotalSeconds)*8/1MB
                Write-Host ("RESULT {0}: {1:N1} Mbps" -f $label,$mbps)
              } finally {foreach($p in @($client,$server)){if($p -and -not $p.HasExited){Stop-Process $p.Id -Force -ErrorAction SilentlyContinue}}}
            }
          } finally {if(-not $http.HasExited){Stop-Process $http.Id -Force -ErrorAction SilentlyContinue}}
          go test ./...
