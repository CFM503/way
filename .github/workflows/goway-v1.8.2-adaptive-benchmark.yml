name: GoWay v1.8.2 Adaptive Mux Benchmark

on:
  push:
    branches:
      - perf-v1.8.2-single-stream
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-benchmark:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: goway/go.mod
      - name: Apply v1.8.2 adaptive-session patch
        shell: pwsh
        working-directory: goway
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Get-Location) 'goway.go'
          $text = Get-Content $path -Raw
          if ($text -notmatch 'Version\s*=\s*"1\.8\.1"') { throw 'Expected v1.8.1 source baseline not found' }
          $old = @'
\tVersion        = "1.8.1"
'@
          $new = @'
\tVersion        = "1.8.2"
'@
          $text = $text.Replace($old, $new)

          $oldBlock = @'
\t// If at least one session is active, select the least loaded (least active streams, with round-robin tie-breaking)
\tif len(p.sessions) > 0 {
\t\tsess := p.pickBestSessionLocked()
\t\tsess.activeStreams.Add(1)

\t\t// If pool capacity is not yet reached, trigger background dial to scale up
\t\tif !p.closed && len(p.sessions)+p.dialing < p.maxSess {
\t\t\tp.dialing++
\t\t\tgo p.dialBackgroundSession()
\t\t}

\t\tp.mu.Unlock()
\t\treturn sess, nil
\t}
'@
          $newBlock = @'
\t// If at least one session is active, select the least loaded (least active streams, with round-robin tie-breaking)
\tif len(p.sessions) > 0 {
\t\t// Scale physical sessions only when the number of existing active streams
\t\t// already fills the current session count. This keeps a single-stream workload
\t\t// on one physical Mux session, while allowing additional sessions to appear
\t\t// as additional concurrent streams arrive.
\t\tactiveBefore := int64(0)
\t\tfor _, s := range p.sessions {
\t\t\tactiveBefore += s.ActiveStreams()
\t\t}

\t\tsess := p.pickBestSessionLocked()
\t\tsess.activeStreams.Add(1)

\t\tif !p.closed && activeBefore >= int64(len(p.sessions)) && len(p.sessions)+p.dialing < p.maxSess {
\t\t\tp.dialing++
\t\t\tgo p.dialBackgroundSession()
\t\t}

\t\tp.mu.Unlock()
\t\treturn sess, nil
\t}
'@
          if (-not $text.Contains($oldBlock)) { throw 'Expected GetSession block not found; refusing to patch' }
          $text = $text.Replace($oldBlock, $newBlock)
          Set-Content -Path $path -Value $text -NoNewline -Encoding utf8
          gofmt -w goway.go
          if (-not (Select-String -Path goway.go -Pattern 'Version\s*=\s*"1\.8\.2"' -Quiet)) { throw 'Version patch verification failed' }
          git diff -- goway.go

      - name: Commit v1.8.2 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goway/goway.go
          git commit -m 'perf(v1.8.2): defer extra Mux sessions until additional streams arrive'
          git push origin HEAD:perf-v1.8.2-single-stream

      - name: Benchmark baseline vs v1.8.2
        shell: pwsh
        working-directory: goway
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '0ba97216b31006a8b10e9dfb9c2ed2fe034d2899'
          git show "$base`:goway/goway.go" | Set-Content baseline-goway.go -NoNewline -Encoding utf8
          go build -trimpath -ldflags='-s -w' -o baseline.exe baseline-goway.go
          go build -trimpath -ldflags='-s -w' -o adaptive.exe goway.go

          $root = Join-Path $env:RUNNER_TEMP 'goway-adaptive-http'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $file = Join-Path $root 'payload.bin'
          $size = 512MB
          $fs = [System.IO.File]::Create($file)
          try { $fs.SetLength($size) } finally { $fs.Dispose() }

          function Run-Case([string]$label, [string]$exe) {
            $serverLog = Join-Path $env:RUNNER_TEMP "$label-server.log"
            $serverErr = Join-Path $env:RUNNER_TEMP "$label-server.err.log"
            $clientLog = Join-Path $env:RUNNER_TEMP "$label-client.log"
            $clientErr = Join-Path $env:RUNNER_TEMP "$label-client.err.log"
            $server = $null; $client = $null
            try {
              $server = Start-Process ".\$exe" -ArgumentList @('-p','127.0.0.1:18880','-k','benchmark','-W','1024','-no-block-local','-log','ERROR') -RedirectStandardOutput $serverLog -RedirectStandardError $serverErr -PassThru
              $client = Start-Process ".\$exe" -ArgumentList @('-p','127.0.0.1:19080','-up','ws://127.0.0.1:18880','-k','benchmark','-W','1024','-no-block-local','-mux','-mux-sessions','4','-log','ERROR') -RedirectStandardOutput $clientLog -RedirectStandardError $clientErr -PassThru
              Start-Sleep -Seconds 3
              if ($server.HasExited -or $client.HasExited) { throw "$label GoWay process exited before benchmark" }
              $sw = [Diagnostics.Stopwatch]::StartNew()
              & curl.exe --fail --silent --show-error --socks5-hostname 127.0.0.1:19080 --output NUL http://127.0.0.1:18000/payload.bin
              $code = $LASTEXITCODE
              $sw.Stop()
              if ($code -ne 0) { throw "$label curl failed: $code" }
              $seconds = [Math]::Max($sw.Elapsed.TotalSeconds,0.000001)
              $mbps = ($size / $seconds) * 8 / 1MB
              [PSCustomObject]@{ Test=$label; Seconds=[Math]::Round($seconds,3); Mbps=[Math]::Round($mbps,1) } | ConvertTo-Json -Compress
            }
            finally {
              foreach ($p in @($client,$server)) { if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } }
              Write-Host "=== $label client ==="
              Get-Content $clientLog -ErrorAction SilentlyContinue | Select-Object -Last 50
              Get-Content $clientErr -ErrorAction SilentlyContinue | Select-Object -Last 50
            }
          }

          $http = Start-Process python -ArgumentList @('-m','http.server','18000','--bind','127.0.0.1','--directory',$root) -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($http.HasExited) { throw 'HTTP server exited' }
            Run-Case 'v1.8.1-baseline' 'baseline.exe'
            Run-Case 'v1.8.2-adaptive' 'adaptive.exe'
          }
          finally {
            if (-not $http.HasExited) { Stop-Process -Id $http.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Test and verify
        shell: pwsh
        working-directory: goway
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          git status --short
